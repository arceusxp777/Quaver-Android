              nat = re.compile(r'\s*<None Update="(?:[^"]*\.(?:so|dll|dylib)|x64/\*)">.*?</None>', re.S)
              for rel in ("Wobble/Wobble/Wobble.csproj", "Wobble/Wobble.Extended/Wobble.Extended.csproj",
                          "Quaver.Shared/Quaver.Shared.csproj"):
                  p = root / rel
                  t = p.read_text(encoding="utf-8-sig")
                  n = t.replace("<TargetFramework>net8.0</TargetFramework>", "<TargetFramework>net8.0-android</TargetFramework>")
                  n, removed = nat.subn("", n)
                  # 'None Update' no saca los archivos del glob por defecto; el SDK de Android sigue viendo
                  # los *.so como bibliotecas nativas sin ABI (XA4301). Se eliminan del glob (CI ronda 4).
                  n = n.replace("</Project>", """  <ItemGroup>
              <None Remove="x64/**" />
