              if t.count(old) != 1: sys.exit(f"PATCH FALLIDO (--android): se esperaba 1 ocurrencia en WobbleGame.cs y hay {t.count(old)}")
              wg.write_text(t.replace(old, "if (RuntimeInformation.IsOSPlatform(OSPlatform.Linux) && !OperatingSystem.IsAndroid())"), encoding="utf-8")
