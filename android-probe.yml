          PY
      - name: Workload android y paquete MonoGame para Android (version = hipotesis)
        run: |
          set +e
          dotnet workload install android 2>&1 | tee android-workload.log
          dotnet add Wobble/Wobble/Wobble.csproj package MonoGame.Framework.Android --version 3.8.1.303 2>&1 | tee -a android-workload.log
      - name: Build Wobble (net8.0-android)
        run: |
          set +e
          dotnet build Wobble/Wobble/Wobble.csproj -f net8.0-android 2>&1 | tee build-android-wobble.log
          echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" | tee -a build-android-wobble.log
      - name: Build Quaver.Shared (net8.0-android)
        run: |
          set +e
          dotnet build Quaver.Shared/Quaver.Shared.csproj -f net8.0-android 2>&1 | tee build-android-shared.log
          echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" | tee -a build-android-shared.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-android-logs
          path: |
            android-workload.log
            build-android-wobble.log
            build-android-shared.log
