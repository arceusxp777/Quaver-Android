              }
          }
          ''', encoding="utf-8")
          print("creado: Wobble/Wobble/Platform/FileDropCompat.cs")
          drop = re.compile(r"(?:GameBase\.Game\.)?\bWindow\.FileDropped")
          total = 0
          for f in (root / "Quaver.Shared").rglob("*.cs"):
              t = f.read_text(encoding="utf-8-sig")
              n, c = drop.subn("Wobble.Platform.FileDropCompat.FileDropped", t)
              if c:
                  f.write_text(n, encoding="utf-8"); total += c
          if total != 13: sys.exit(f"PATCH FALLIDO: se esperaban 13 usos de FileDropped y hay {total}")
          print("FileDropped redirigido en", total, "sitios")

          # 7) Modo --android (SONDA): Wobble, Wobble.Extended y Quaver.Shared como net8.0-android y
