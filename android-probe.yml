# Sondas de diagnostico (NO generan APK). Ejecutar a mano desde Actions.
#  baseline         : Quaver de escritorio tal cual, con los submodulos reales.
#  upstream-patched : escritorio contra MonoGame UPSTREAM (NuGet) + parche PROVISIONAL.
#  android-probe    : Wobble y Quaver.Shared como net8.0-android (solo para listar errores de C#).
name: android-probe-baseline

on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Submodulos (como en el README, sin Server.Client)
        run: git -c submodule."Quaver.Server.Client".update=none submodule update --init --recursive
      - name: Versiones y commits efectivos
        run: |
          dotnet --info | tee versions.log
          git submodule status | tee -a versions.log
          git rev-parse HEAD | tee -a versions.log
      - name: Build de escritorio (Debug)
        run: |
          set +e
          cd Quaver
          dotnet build 2>&1 | tee ../build.log
          echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" | tee -a ../build.log
      - name: Tests de Quaver.API (net6.0 -> roll-forward al runtime disponible)
        continue-on-error: true
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          set +e
          dotnet test Quaver.API/Quaver.API.Tests 2>&1 | tee test-api.log
          echo "TEST_EXIT_CODE=${PIPESTATUS[0]}" | tee -a test-api.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-logs
          path: |
            versions.log
            build.log
            test-api.log

  upstream-patched:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Submodulos
        run: git -c submodule."Quaver.Server.Client".update=none submodule update --init --recursive
      - name: Parche PROVISIONAL para MonoGame upstream
        run: |
          python3 - . <<'PY'
          """PROVISIONAL (solo sonda de CI). Adapta Wobble/Quaver para compilar contra MonoGame
          upstream (NuGet) en lugar del fork binario de Quaver. Falla con error claro si algun
          patron no se encuentra (p.ej. si el commit de Wobble cambia)."""
          import re, sys, pathlib

          root = pathlib.Path(sys.argv[1] if len(sys.argv) > 1 else ".")
          W = root / "Wobble" / "Wobble"

          def rw(path, fn):
              t = path.read_text(encoding="utf-8-sig")
              n = fn(t)
              if n == t:
                  sys.exit(f"PATCH FALLIDO: sin cambios en {path}")
              path.write_text(n, encoding="utf-8")
              print("parcheado:", path.relative_to(root))

          # 1) Quitar la DLL propia de MonoGame de todos los csproj
          ref = re.compile(r'\s*<Reference Include="MonoGame\.Framework">.*?</Reference>', re.S)
          for p in root.rglob("*.csproj"):
              t = p.read_text(encoding="utf-8-sig")
              n = ref.sub("", t)
              if n != t:
                  p.write_text(n, encoding="utf-8"); print("csproj sin DLL propia:", p.relative_to(root))

          # 2) Game(bool preferWayland) no existe en upstream: ctor sin argumentos (parametro ignorado)
          def wobblegame(t):
              t = t.replace(": base(preferWayland)", ": base()")
              # WaylandVsync solo existe en el Game del fork: propiedad sin efecto (PROVISIONAL)
              return re.sub(r"(public abstract class WobbleGame : Game\s*\{)",
                            r"\1\n        public bool WaylandVsync { get; set; } // PROVISIONAL: sin efecto fuera del fork\n", t, count=1)
          rw(W / "WobbleGame.cs", wobblegame)

          # 3) Portapapeles: upstream no tiene Game.Get/SetClipboardText. STUB en memoria (PROVISIONAL).
          rw(W / "Platform" / "Linux" / "SdlClipboard.cs", lambda t: re.sub(
              r"public override string GetText\(\).*?;\s*public override void SetText\(string selectedText\).*?;",
              "private static string _text = \"\"; // PROVISIONAL: portapapeles solo en memoria\n"
              "        public override string GetText() => _text;\n\n"
              "        public override void SetText(string selectedText) => _text = selectedText ?? \"\";",
              t, flags=re.S))

          # 4) Teclas solo del fork (AZERTY): se eliminan sus nombres de visualizacion
          bad = "Asterisk|Squared|OemColon|OemCloseParenthesis|OemExclamationMark|Caret|DollarSign|PunctuatedU"
          case = re.compile(r'\s*case Keys\.(?:%s):\s*(?:keyStr = "[^"]*";\s*)?return [^;]*;' % bad)
          def keys(t):
              n, c = case.subn("", t)
              if c != 8: sys.exit(f"PATCH FALLIDO: se esperaban 8 'case' y hay {c}")
              return n
          rw(W / "Helpers" / "XnaKeyHelper.cs", keys)

          # 5) SpriteBatch.Draw con destino RectangleF (sobrecarga del fork) -> extension equivalente
          ext = W / "Graphics" / "SpriteBatchRectangleFExtensions.cs"
          ext.write_text('''using Microsoft.Xna.Framework;
          using Microsoft.Xna.Framework.Graphics;
          using MonoGame.Extended;

          namespace Wobble.Graphics
          {
              // PROVISIONAL: sustituye la sobrecarga Draw(..., RectangleF, ...) del fork de MonoGame.
              // Equivalente a Draw con rectangulo destino: posicion = (X,Y), escala = destino/origen,
              // 'origin' en pixeles de textura.
              public static class SpriteBatchRectangleFExtensions
              {
                  public static void Draw(this SpriteBatch sb, Texture2D texture, RectangleF destination,
                      Rectangle? source, Color color, float rotation, Vector2 origin, SpriteEffects effects, float layerDepth)
                  {
                      var sw = source?.Width ?? texture.Width;
                      var sh = source?.Height ?? texture.Height;
                      var scale = new Vector2(sw == 0 ? 0 : destination.Width / sw, sh == 0 ? 0 : destination.Height / sh);
                      sb.Draw(texture, new Vector2(destination.X, destination.Y), source, color, rotation, origin, scale, effects, layerDepth);
                  }
              }
          }
          ''', encoding="utf-8")
          print("creado:", ext.relative_to(root))

          # 6) GameWindow.FileDropped solo existe en el fork de MonoGame.
          #    Se redirige a un evento estatico que NUNCA se dispara (PROVISIONAL: sin arrastrar y soltar).
          (W / "Platform" / "FileDropCompat.cs").write_text('''using System;

          namespace Wobble.Platform
          {
              // PROVISIONAL: sustituye GameWindow.FileDropped del fork. No se dispara nunca.
              public static class FileDropCompat
              {
                  public static event EventHandler<string> FileDropped { add { } remove { } }
              }
          }
          ''', encoding="utf-8")
          print("creado: Wobble/Wobble/Platform/FileDropCompat.cs")
          drop = re.compile(r"(?:GameBase\.Game\.)?\bWindow\.FileDropped")
          total = 0
          for f in (root / "Quaver.Shared").rglob("*.cs"):
              t = f.read_text(encoding="utf-8-sig")
              n, c = drop.subn("Wobble.Platform.FileDropCompat.FileDropped", t)
              if c:
                  f.write_text(n, encoding="utf-8"); total += c
          if total != 13: sys.exit(f"PATCH FALLIDO: se esperaban 13 usos de FileDropped y hay {total}")
          print("FileDropped redirigido en", total, "sitios")

          # 7) Modo --android (SONDA): Wobble, Wobble.Extended y Quaver.Shared como net8.0-android y
          #    sin los binarios nativos de escritorio (.so/.dll/.dylib/x64/*), que rompen el empaquetado
          #    de Android (XA4301). NO anade soporte real de audio/Steam: es solo para ver errores de C#.
          if "--android" in sys.argv:
              nat = re.compile(r'\s*<None Update="(?:[^"]*\.(?:so|dll|dylib)|x64/\*)">.*?</None>', re.S)
              for rel in ("Wobble/Wobble/Wobble.csproj", "Wobble/Wobble.Extended/Wobble.Extended.csproj",
                          "Quaver.Shared/Quaver.Shared.csproj"):
                  p = root / rel
                  t = p.read_text(encoding="utf-8-sig")
                  n = t.replace("<TargetFramework>net8.0</TargetFramework>", "<TargetFramework>net8.0-android</TargetFramework>")
                  n, removed = nat.subn("", n)
                  # 'None Update' no saca los archivos del glob por defecto; el SDK de Android sigue viendo
                  # los *.so como bibliotecas nativas sin ABI (XA4301). Se eliminan del glob (CI ronda 4).
                  n = n.replace("</Project>", """  <ItemGroup>
              <None Remove="x64/**" />
              <None Remove="**/*.so" />
              <None Remove="**/*.dylib" />
              <None Remove="**/*.dll" />
            </ItemGroup>
          </Project>""")
                  if n == t: sys.exit(f"PATCH FALLIDO (--android): sin cambios en {rel}")
                  p.write_text(n, encoding="utf-8")
                  print(f"android: {rel} -> net8.0-android, {removed} items nativos quitados")

              # En .NET Android, OSPlatform.Linux tambien es true: el dlopen de "libdl.so.2" (solo glibc)
              # fallaria al arrancar. Se excluye Android (la carga de libbass en Android la hace el APK).
              wg = W / "WobbleGame.cs"
              t = wg.read_text(encoding="utf-8-sig")
              old = "if (RuntimeInformation.IsOSPlatform(OSPlatform.Linux))"
              if t.count(old) != 1: sys.exit(f"PATCH FALLIDO (--android): se esperaba 1 ocurrencia en WobbleGame.cs y hay {t.count(old)}")
              wg.write_text(t.replace(old, "if (RuntimeInformation.IsOSPlatform(OSPlatform.Linux) && !OperatingSystem.IsAndroid())"), encoding="utf-8")
              print("android: WobbleGame.cs excluye Android del dlopen(libdl.so.2)")

          PY
      - name: Paquete MonoGame upstream (version = hipotesis)
        run: dotnet add Wobble/Wobble/Wobble.csproj package MonoGame.Framework.DesktopGL --version 3.8.1.303
      - name: Build (guarda todos los errores)
        run: |
          set +e
          cd Quaver
          dotnet build 2>&1 | tee ../build-upstream-patched.log
          echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" | tee -a ../build-upstream-patched.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-upstream-patched-logs
          path: build-upstream-patched.log

  android-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Fijar SDK .NET 8 (el runner trae tambien el 10)
        run: |
          echo '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' > global.json
          dotnet --version
      - name: Submodulos
        run: git -c submodule."Quaver.Server.Client".update=none submodule update --init --recursive
      - name: Parche PROVISIONAL para MonoGame upstream
        run: |
          python3 - . --android <<'PY'
          """PROVISIONAL (solo sonda de CI). Adapta Wobble/Quaver para compilar contra MonoGame
          upstream (NuGet) en lugar del fork binario de Quaver. Falla con error claro si algun
          patron no se encuentra (p.ej. si el commit de Wobble cambia)."""
