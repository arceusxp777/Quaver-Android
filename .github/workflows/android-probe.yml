              # D. Conversion MGFX v9 -> v10 para MonoGame 3.8.1.303 y verificacion byte-a-byte
              def r7bit(data, p):
                  res, sh = 0, 0
                  while True:
                      b = data[p]; p += 1
                      res |= (b & 0x7f) << sh
                      if not (b & 0x80):
                          return res, p
                      sh += 7

              def w7bit(n):
                  out = bytearray()
                  while n >= 0x80:
                      out.append((n & 0x7f) | 0x80)
                      n >>= 7
                  out.append(n)
                  return bytes(out)

              def copy_str(data, p):
                  n, p2 = r7bit(data, p)
                  return w7bit(n) + data[p2:p2 + n], p2 + n

              def convert_mgfx_v9_to_v10(data):
                  assert data[:4] == b"MGFX", "Firma MGFX invalida"
                  ver, prof = data[4], data[5]
                  if ver >= 10:
                      return data
                  assert ver == 9, f"Version MGFX inesperada: {ver}"
                  key = data[6:10]
                  p = 10
                  out = bytearray(b"MGFX" + bytes([10, prof]) + key)

                  def copy_ann(d, pos):
                      cnt = d[pos]; pos += 1
                      assert cnt == 0, f"Anotaciones != 0 ({cnt})"
                      return struct.pack("<i", 0), pos

                  def copy_params(d, pos):
                      cnt = d[pos]; pos += 1
                      buf = bytearray(struct.pack("<i", cnt))
                      for _ in range(cnt):
                          cls = d[pos]; pos += 1
                          typ = d[pos]; pos += 1
                          buf.append(cls); buf.append(typ)
                          rn, pos = copy_str(d, pos); buf += rn
                          rs, pos = copy_str(d, pos); buf += rs
                          ann, pos = copy_ann(d, pos); buf += ann
                          row = d[pos]; pos += 1
                          col = d[pos]; pos += 1
                          buf.append(row); buf.append(col)
                          elems, pos = copy_params(d, pos); buf += elems
                          structs, pos = copy_params(d, pos); buf += structs
                          el_cnt = struct.unpack_from("<i", elems, 0)[0]
                          st_cnt = struct.unpack_from("<i", structs, 0)[0]
                          if el_cnt == 0 and st_cnt == 0 and typ in (1, 2, 3):
                              nb = row * col * 4
                              buf += d[pos:pos + nb]; pos += nb
                      return bytes(buf), pos

                  cb_cnt = data[p]; p += 1
                  out += struct.pack("<i", cb_cnt)
                  for _ in range(cb_cnt):
                      rn, p = copy_str(data, p); out += rn
                      out += data[p:p + 2]; p += 2
                      pc = data[p]; p += 1
                      out += struct.pack("<i", pc)
                      for _ in range(pc):
                          out += struct.pack("<i", data[p]); p += 1
                          out += data[p:p + 2]; p += 2

                  sh_cnt = data[p]; p += 1
                  out += struct.pack("<i", sh_cnt)
                  for _ in range(sh_cnt):
                      out.append(data[p]); p += 1
                      blen = struct.unpack_from("<i", data, p)[0]; p += 4
                      out += struct.pack("<i", blen)
                      out += data[p:p + blen]; p += blen
                      smp_cnt = data[p]; p += 1
                      out.append(smp_cnt)
                      for _ in range(smp_cnt):
                          out += data[p:p + 3]; p += 3
                          has_st = data[p]; p += 1; out.append(has_st)
                          if has_st:
                              out += data[p:p + 20]; p += 20
                          sn, p = copy_str(data, p); out += sn
                          out.append(data[p]); p += 1
                      cb_sh = data[p]; p += 1; out.append(cb_sh)
                      out += data[p:p + cb_sh]; p += cb_sh
                      ac = data[p]; p += 1; out.append(ac)
                      for _ in range(ac):
                          an, p = copy_str(data, p); out += an
                          out += data[p:p + 4]; p += 4

                  params_b, p = copy_params(data, p)
                  out += params_b

                  tc = data[p]; p += 1
                  out += struct.pack("<i", tc)
                  for _ in range(tc):
                      tn, p = copy_str(data, p); out += tn
                      ta, p = copy_ann(data, p); out += ta
                      pc = data[p]; p += 1
                      out += struct.pack("<i", pc)
                      for _ in range(pc):
                          pn, p = copy_str(data, p); out += pn
                          pa, p = copy_ann(data, p); out += pa
                          vs = struct.unpack_from("<b", data, p)[0]; p += 1
                          ps = struct.unpack_from("<b", data, p)[0]; p += 1
                          out += struct.pack("<ii", vs, ps)
                          hb = data[p]; p += 1; out.append(hb)
                          if hb: out += data[p:p + 19]; p += 19
                          hd = data[p]; p += 1; out.append(hd)
                          if hd: out += data[p:p + 31]; p += 31
                          hr = data[p]; p += 1; out.append(hr)
                          if hr: out += data[p:p + 12]; p += 12

                  assert p == len(data), f"MGFX parse mismatch: {p} != {len(data)}"
                  return bytes(out)

              def verify_mgfx_v10(data):
                  assert data[:4] == b"MGFX" and data[4] in (10, 11) and data[5] == 0
                  p = 10
                  def ri32():
                      nonlocal p
                      v = struct.unpack_from("<i", data, p)[0]; p += 4; return v
                  def rs():
                      nonlocal p
                      n, p = r7bit(data, p); p += n
                  cb = ri32()
                  for _ in range(cb):
                      rs(); p += 2
                      pc = ri32(); p += pc * 6
                  sh = ri32()
                  for _ in range(sh):
                      p += 1
                      blen = ri32()
                      p += blen
                      smp = data[p]; p += 1
                      for _ in range(smp):
                          p += 3
                          if data[p]: p += 21
                          else: p += 1
                          rs(); p += 1
                      cbc = data[p]; p += 1 + cbc
                      ac = data[p]; p += 1
                      for _ in range(ac):
                          rs(); p += 4
                  def skip_params():
                      nonlocal p
                      cnt = ri32()
                      for _ in range(cnt):
                          typ = data[p + 1]; p += 2
                          rs(); rs()
                          assert ri32() == 0
                          row, col = data[p], data[p + 1]; p += 2
                          ec = skip_params()
                          sc = skip_params()
                          if ec == 0 and sc == 0 and typ in (1, 2, 3):
                              p += row * col * 4
                      return cnt
                  skip_params()
                  tc = ri32()
                  for _ in range(tc):
                      rs(); assert ri32() == 0
                      pc2 = ri32()
                      for _ in range(pc2):
                          rs(); assert ri32() == 0
                          p += 8
                          p += 20 if data[p] else 1
                          p += 32 if data[p] else 1
                          p += 13 if data[p] else 1
                  assert p == len(data), f"v10 verify mismatch: {p} != {len(data)}"

              mgfx_files = sorted(root.rglob("*.mgfxo"))
              if not mgfx_files:
                  sys.exit("PATCH FALLIDO (--android): no se encontraron shaders *.mgfxo")
              for mg in mgfx_files:
                  conv = convert_mgfx_v9_to_v10(mg.read_bytes())
                  verify_mgfx_v10(conv)
                  mg.write_bytes(conv)
                  print("android shader v9->v10 OK:", mg.relative_to(root))

