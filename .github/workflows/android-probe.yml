# Workflow de compilacion y sondas Quaver Android v18
name: android-probe-v18

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/android-probe.yml'

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Submodulos (como en el README, sin Server.Client)
        run: git -c submodule."Quaver.Server.Client".update=none submodule update --init --recursive
      - name: Versiones y commits efectivos
        run: |
          dotnet --info | tee versions.log
          git submodule status | tee -a versions.log
          git rev-parse HEAD | tee -a versions.log
      - name: Build de escritorio (Debug)
        run: |
          set +e
          cd Quaver
          dotnet build 2>&1 | tee ../build.log
          echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" | tee -a ../build.log
      - name: Tests de Quaver.API (net6.0 -> roll-forward al runtime disponible)
        continue-on-error: true
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          set +e
          dotnet test Quaver.API/Quaver.API.Tests 2>&1 | tee test-api.log
          echo "TEST_EXIT_CODE=${PIPESTATUS[0]}" | tee -a test-api.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-logs
          path: |
            versions.log
            build.log
            test-api.log


  upstream-patched:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Submodulos
        run: git -c submodule."Quaver.Server.Client".update=none submodule update --init --recursive
      - name: Parche PROVISIONAL para MonoGame upstream
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" . <<'PY' 2>&1 | tee patch.log
          # PROVISIONAL (solo sonda de CI). Adapta Wobble/Quaver para compilar contra MonoGame
          # upstream (NuGet) en lugar del fork binario de Quaver y ejecuta ajustes reales de Android.
          import re, sys, pathlib, struct, shutil

          print("patch_upstream v18")

          root = pathlib.Path(sys.argv[1] if len(sys.argv) > 1 else ".")
          W = root / "Wobble" / "Wobble"

          def rw(path, fn):
              t = path.read_text(encoding="utf-8-sig")
              n = fn(t)
              if n == t:
                  sys.exit(f"PATCH FALLIDO: sin cambios en {path}")
              path.write_text(n, encoding="utf-8")
              print("parcheado:", path.relative_to(root))

          # 1) Quitar la DLL propia de MonoGame de todos los csproj
          ref = re.compile(r'\s*<Reference Include="MonoGame\.Framework">.*?</Reference>', re.S)
          for p in root.rglob("*.csproj"):
              t = p.read_text(encoding="utf-8-sig")
              n = ref.sub("", t)
              if n != t:
                  p.write_text(n, encoding="utf-8")
                  print("csproj sin DLL propia:", p.relative_to(root))

          # 2) Game(bool preferWayland) no existe en upstream: ctor sin argumentos
          def wobblegame_common(t):
              t = t.replace(": base(preferWayland)", ": base()")
              return re.sub(
                  r"(public abstract class WobbleGame : Game\s*\{)",
                  r"\1\n        public bool WaylandVsync { get; set; } // PROVISIONAL: sin efecto fuera del fork\n",
                  t,
                  count=1,
              )
          rw(W / "WobbleGame.cs", wobblegame_common)

          # 3) Portapapeles en memoria
          rw(
              W / "Platform" / "Linux" / "SdlClipboard.cs",
              lambda t: re.sub(
                  r"public override string GetText\(\).*?;\s*public override void SetText\(string selectedText\).*?;",
                  'private static string _text = "";\n'
                  '        public override string GetText() => _text;\n\n'
                  '        public override void SetText(string selectedText) => _text = selectedText ?? "";',
                  t,
                  flags=re.S,
              ),
          )

          # 4) Teclas solo del fork (AZERTY)
          bad = "Asterisk|Squared|OemColon|OemCloseParenthesis|OemExclamationMark|Caret|DollarSign|PunctuatedU"
          case = re.compile(r'\s*case Keys\.(?:%s):\s*(?:keyStr = "[^"]*";\s*)?return [^;]*;' % bad)
          def keys(t):
              n, c = case.subn("", t)
              if c != 8:
                  sys.exit(f"PATCH FALLIDO: se esperaban 8 'case' y hay {c}")
              return n
          rw(W / "Helpers" / "XnaKeyHelper.cs", keys)

          # 5) SpriteBatch.Draw(..., RectangleF, ...) extension
          ext = W / "Graphics" / "SpriteBatchRectangleFExtensions.cs"
          ext.write_text('''using Microsoft.Xna.Framework;
          using Microsoft.Xna.Framework.Graphics;
          using MonoGame.Extended;

          namespace Wobble.Graphics
          {
              public static class SpriteBatchRectangleFExtensions
              {
                  public static void Draw(this SpriteBatch sb, Texture2D texture, RectangleF destination,
                      Rectangle? source, Color color, float rotation, Vector2 origin, SpriteEffects effects, float layerDepth)
                  {
                      var sw = source?.Width ?? texture.Width;
                      var sh = source?.Height ?? texture.Height;
                      var scale = new Vector2(sw == 0 ? 0 : destination.Width / sw, sh == 0 ? 0 : destination.Height / sh);
                      sb.Draw(texture, new Vector2(destination.X, destination.Y), source, color, rotation, origin, scale, effects, layerDepth);
                  }
              }
          }
          ''', encoding="utf-8")
          print("creado:", ext.relative_to(root))

          # 6) FileDropped compat
          (W / "Platform" / "FileDropCompat.cs").write_text('''using System;

          namespace Wobble.Platform
          {
              public static class FileDropCompat
              {
                  public static event EventHandler<string> FileDropped { add { } remove { } }
              }
          }
          ''', encoding="utf-8")
          print("creado: Wobble/Wobble/Platform/FileDropCompat.cs")
          drop = re.compile(r"(?:GameBase\.Game\.)?\bWindow\.FileDropped")
          total = 0
          for f in (root / "Quaver.Shared").rglob("*.cs"):
              t = f.read_text(encoding="utf-8-sig")
              n, c = drop.subn("Wobble.Platform.FileDropCompat.FileDropped", t)
              if c:
                  f.write_text(n, encoding="utf-8")
                  total += c
          if total != 13:
              sys.exit(f"PATCH FALLIDO: se esperaban 13 usos de FileDropped y hay {total}")
          print("FileDropped redirigido en", total, "sitios")

          # 7) Modo --android: compilacion net8.0-android + arreglos reales de video, audio, shaders, BD y tactil
          if "--android" in sys.argv:
              # A. TFM net8.0-android y limpieza de binarios de escritorio
              nat = re.compile(r'\s*<None Update="(?:[^"]*\.(?:so|dll|dylib)|x64/\*)">.*?</None>', re.S)
              for rel in (
                  "Wobble/Wobble/Wobble.csproj",
                  "Wobble/Wobble.Extended/Wobble.Extended.csproj",
                  "Quaver.Shared/Quaver.Shared.csproj",
              ):
                  p = root / rel
                  t = p.read_text(encoding="utf-8-sig")
                  n = t.replace("<TargetFramework>net8.0</TargetFramework>", "<TargetFramework>net8.0-android</TargetFramework>")
                  n, removed = nat.subn("", n)
                  n = n.replace(
                      "</Project>",
                      '  <ItemGroup>\n'
                      '    <None Remove="x64/**" />\n'
                      '    <None Remove="**/*.so" />\n'
                      '    <None Remove="**/*.dylib" />\n'
                      '    <None Remove="**/*.dll" />\n'
                      '  </ItemGroup>\n'
                      '</Project>',
                  )
                  if n == t:
                      sys.exit(f"PATCH FALLIDO (--android): sin cambios en {rel}")
                  if "NU1902" not in n:
                      n = n.replace(
                          "</Project>",
                          '  <PropertyGroup>\n'
                          '    <NoWarn>$(NoWarn);NU1902;NU1903;NU1701;CS1570;CS1572;CS1574</NoWarn>\n'
                          '  </PropertyGroup>\n'
                          '</Project>',
                      )
                  p.write_text(n, encoding="utf-8")
                  print(f"android: {rel} -> net8.0-android, {removed} items nativos quitados")

              api_proj = root / "Quaver.API" / "Quaver.API" / "Quaver.API.csproj"
              if api_proj.is_file():
                  at = api_proj.read_text(encoding="utf-8-sig")
                  if "NU1902" not in at:
                      at = at.replace(
                          "</Project>",
                          '  <PropertyGroup>\n'
                          '    <NoWarn>$(NoWarn);NU1902;NU1903;NU1701</NoWarn>\n'
                          '  </PropertyGroup>\n'
                          '</Project>',
                      )
                      api_proj.write_text(at, encoding="utf-8")
                      print("android: Quaver.API.csproj NoWarn NU1902/NU1903/NU1701 agregado")

              x64 = root / "Wobble" / "Wobble" / "x64"
              if not x64.is_dir():
                  sys.exit("PATCH FALLIDO (--android): no existe Wobble/Wobble/x64")
              shutil.rmtree(x64)
              print("android: borrado", x64.relative_to(root))
              for base, pat in (
                  (root / "Wobble" / "Wobble", "*.dylib"),
                  (root / "Quaver.Shared", "libsteam_api.*"),
                  (root / "Quaver.Shared", "steam_api*.dll"),
              ):
                  for fl in sorted(base.glob(pat)):
                      fl.unlink()
                      print("android: borrado", fl.relative_to(root))

              wc = root / "Wobble" / "Wobble" / "Wobble.csproj"
              t = wc.read_text(encoding="utf-8-sig")
              old = '<PackageReference Include="MonoGame.Extended" Version="3.8.0" />'
              if t.count(old) != 1:
                  sys.exit("PATCH FALLIDO (--android): MonoGame.Extended 3.8.0 no encontrado")
              wc.write_text(t.replace(old, '<PackageReference Include="MonoGame.Extended" Version="3.8.0" ExcludeAssets="contentFiles" />'), encoding="utf-8")

              # B. Paquetes Android nativos reales en Quaver.Shared.csproj (SQLite 2.1.11 Android + SkiaSharp 3.119.0 + Steamworks sin nativos)
              qs_proj = root / "Quaver.Shared" / "Quaver.Shared.csproj"
              t = qs_proj.read_text(encoding="utf-8-sig")
              pkg_replacements = [
                  ('<PackageReference Include="SkiaSharp" Version="4.148.0" />',
                   '<PackageReference Include="SkiaSharp" Version="3.119.0" />'),
                  ('<PackageReference Include="SkiaSharp.NativeAssets.Linux.NoDependencies" Version="4.148.0" />',
                   '<PackageReference Include="SkiaSharp.NativeAssets.Android" Version="3.119.0" />'),
                  ('<PackageReference Include="SQLitePCLRaw.bundle_green" Version="2.0.6" />',
                   '<PackageReference Include="SQLitePCLRaw.bundle_green" Version="2.1.11" />'),
                  ('<PackageReference Include="SQLitePCLRaw.core" Version="2.0.6" />',
                   '<PackageReference Include="SQLitePCLRaw.core" Version="2.1.11" />'),
                  ('<PackageReference Include="SQLitePCLRaw.lib.e_sqlite3" Version="2.0.6" />',
                   '<PackageReference Include="SQLitePCLRaw.lib.e_sqlite3.android" Version="2.1.11" />'),
                  ('<PackageReference Include="SQLitePCLRaw.provider.e_sqlite3" Version="2.0.6" />',
                   '<PackageReference Include="SQLitePCLRaw.provider.e_sqlite3" Version="2.1.11" />'),
                  ('<PackageReference Include="Steamworks.NET.AnyCPU" Version="2026.164.0" IncludeAssets="all" />',
                   '<PackageReference Include="Steamworks.NET.AnyCPU" Version="2026.164.0" ExcludeAssets="native;contentFiles" />'),
              ]
              for a, b in pkg_replacements:
                  if t.count(a) != 1:
                      sys.exit(f"PATCH FALLIDO (Quaver.Shared.csproj): no se encontro {a}")
                  t = t.replace(a, b)
              qs_proj.write_text(t, encoding="utf-8")
              print("android: Quaver.Shared.csproj actualizado con SQLitePCLRaw 2.1.11 (.android), SkiaSharp 3.119.0 (.android) y Steamworks sin nativos")

              # C. Diagnostico persistente en C# 8 puro dentro de Wobble.Logging
              (W / "Logging" / "AndroidDiagnostics.cs").write_text('''using System;
          using System.IO;

          namespace Wobble.Logging
          {
              public static class AndroidDiagnostics
              {
                  private static readonly object Sync = new object();
                  public static event Action<string> OnFatal;
                  public static string LastFatalError { get; private set; }

                  public static void Trace(string step)
                  {
                      try
                      {
                          var line = "[" + DateTime.UtcNow.ToString("HH:mm:ss.fff") + "] " + step;
                          Console.WriteLine("[QuaverTrace] " + line);

                          var dir = Path.Combine(global::Wobble.WobbleGame.WorkingDirectory, "Logs");
                          Directory.CreateDirectory(dir);
                          lock (Sync)
                              File.AppendAllText(Path.Combine(dir, "boot-trace.log"), line + Environment.NewLine);
                      }
                      catch
                      {
                      }
                  }

                  public static void Fatal(string origin, Exception ex)
                  {
                      var msg = origin + ": " + (ex != null ? ex.ToString() : "unknown error");
                      LastFatalError = msg;
                      Trace("FATAL " + msg);
                      try
                      {
                          OnFatal?.Invoke(msg);
                      }
                      catch
                      {
                      }
                  }
              }
          }
          ''', encoding="utf-8")
              print("android: creado Wobble/Wobble/Logging/AndroidDiagnostics.cs")

              # D. Conversion MGFX v9 -> v10 para MonoGame 3.8.1.303 y verificacion byte-a-byte
              def r7bit(data, p):
                  res, sh = 0, 0
                  while True:
                      b = data[p]; p += 1
                      res |= (b & 0x7f) << sh
                      if not (b & 0x80):
                          return res, p
                      sh += 7

              def w7bit(n):
                  out = bytearray()
                  while n >= 0x80:
                      out.append((n & 0x7f) | 0x80)
                      n >>= 7
                  out.append(n)
                  return bytes(out)

              def copy_str(data, p):
                  n, p2 = r7bit(data, p)
                  return w7bit(n) + data[p2:p2 + n], p2 + n

              def convert_mgfx_v9_to_v10(data):
                  assert data[:4] == b"MGFX", "Firma MGFX invalida"
                  ver, prof = data[4], data[5]
                  if ver >= 10:
                      return data
                  assert ver == 9, f"Version MGFX inesperada: {ver}"
                  key = data[6:10]
                  p = 10
                  out = bytearray(b"MGFX" + bytes([10, prof]) + key)

                  def copy_ann(d, pos):
                      cnt = d[pos]; pos += 1
                      assert cnt == 0, f"Anotaciones != 0 ({cnt})"
                      return struct.pack("<i", 0), pos

                  def copy_params(d, pos):
                      cnt = d[pos]; pos += 1
                      buf = bytearray(struct.pack("<i", cnt))
                      for _ in range(cnt):
                          cls = d[pos]; pos += 1
                          typ = d[pos]; pos += 1
                          buf.append(cls); buf.append(typ)
                          rn, pos = copy_str(d, pos); buf += rn
                          rs, pos = copy_str(d, pos); buf += rs
                          ann, pos = copy_ann(d, pos); buf += ann
                          row = d[pos]; pos += 1
                          col = d[pos]; pos += 1
                          buf.append(row); buf.append(col)
                          elems, pos = copy_params(d, pos); buf += elems
                          structs, pos = copy_params(d, pos); buf += structs
                          el_cnt = struct.unpack_from("<i", elems, 0)[0]
                          st_cnt = struct.unpack_from("<i", structs, 0)[0]
                          if el_cnt == 0 and st_cnt == 0 and typ in (1, 2, 3):
                              nb = row * col * 4
                              buf += d[pos:pos + nb]; pos += nb
                      return bytes(buf), pos

                  cb_cnt = data[p]; p += 1
                  out += struct.pack("<i", cb_cnt)
                  for _ in range(cb_cnt):
                      rn, p = copy_str(data, p); out += rn
                      out += data[p:p + 2]; p += 2
                      pc = data[p]; p += 1
                      out += struct.pack("<i", pc)
                      for _ in range(pc):
                          out += struct.pack("<i", data[p]); p += 1
                          out += data[p:p + 2]; p += 2

                  sh_cnt = data[p]; p += 1
                  out += struct.pack("<i", sh_cnt)
                  for _ in range(sh_cnt):
                      out.append(data[p]); p += 1
                      blen = struct.unpack_from("<i", data, p)[0]; p += 4
                      out += struct.pack("<i", blen)
                      out += data[p:p + blen]; p += blen
                      smp_cnt = data[p]; p += 1
                      out.append(smp_cnt)
                      for _ in range(smp_cnt):
                          out += data[p:p + 3]; p += 3
                          has_st = data[p]; p += 1; out.append(has_st)
                          if has_st:
                              out += data[p:p + 20]; p += 20
                          sn, p = copy_str(data, p); out += sn
                          out.append(data[p]); p += 1
                      cb_sh = data[p]; p += 1; out.append(cb_sh)
                      out += data[p:p + cb_sh]; p += cb_sh
                      ac = data[p]; p += 1; out.append(ac)
                      for _ in range(ac):
                          an, p = copy_str(data, p); out += an
                          out += data[p:p + 4]; p += 4

                  params_b, p = copy_params(data, p)
                  out += params_b

                  tc = data[p]; p += 1
                  out += struct.pack("<i", tc)
                  for _ in range(tc):
                      tn, p = copy_str(data, p); out += tn
                      ta, p = copy_ann(data, p); out += ta
                      pc = data[p]; p += 1
                      out += struct.pack("<i", pc)
                      for _ in range(pc):
                          pn, p = copy_str(data, p); out += pn
                          pa, p = copy_ann(data, p); out += pa
                          vs = struct.unpack_from("<b", data, p)[0]; p += 1
                          ps = struct.unpack_from("<b", data, p)[0]; p += 1
                          out += struct.pack("<ii", vs, ps)
                          hb = data[p]; p += 1; out.append(hb)
                          if hb: out += data[p:p + 19]; p += 19
                          hd = data[p]; p += 1; out.append(hd)
                          if hd: out += data[p:p + 31]; p += 31
                          hr = data[p]; p += 1; out.append(hr)
                          if hr: out += data[p:p + 12]; p += 12

                  assert p == len(data), f"MGFX parse mismatch: {p} != {len(data)}"
                  return bytes(out)

              def verify_mgfx_v10(data):
                  assert data[:4] == b"MGFX" and data[4] in (10, 11) and data[5] == 0
                  p = 10
                  def ri32():
                      nonlocal p
                      v = struct.unpack_from("<i", data, p)[0]; p += 4; return v
                  def rs():
                      nonlocal p
                      n, p = r7bit(data, p); p += n
                  cb = ri32()
                  for _ in range(cb):
                      rs(); p += 2
                      pc = ri32(); p += pc * 6
                  sh = ri32()
                  for _ in range(sh):
                      p += 1
                      blen = ri32()
                      p += blen
                      smp = data[p]; p += 1
                      for _ in range(smp):
                          p += 3
                          if data[p]: p += 21
                          else: p += 1
                          rs(); p += 1
                      cbc = data[p]; p += 1 + cbc
                      ac = data[p]; p += 1
                      for _ in range(ac):
                          rs(); p += 4
                  def skip_params():
                      nonlocal p
                      cnt = ri32()
                      for _ in range(cnt):
                          typ = data[p + 1]; p += 2
                          rs(); rs()
                          assert ri32() == 0
                          row, col = data[p], data[p + 1]; p += 2
                          ec = skip_params()
                          sc = skip_params()
                          if ec == 0 and sc == 0 and typ in (1, 2, 3):
                              p += row * col * 4
                      return cnt
                  skip_params()
                  tc = ri32()
                  for _ in range(tc):
                      rs(); assert ri32() == 0
                      pc2 = ri32()
                      for _ in range(pc2):
                          rs(); assert ri32() == 0
                          p += 8
                          p += 20 if data[p] else 1
                          p += 32 if data[p] else 1
                          p += 13 if data[p] else 1
                  assert p == len(data), f"v10 verify mismatch: {p} != {len(data)}"

              mgfx_files = sorted(root.rglob("*.mgfxo"))
              if not mgfx_files:
                  sys.exit("PATCH FALLIDO (--android): no se encontraron shaders *.mgfxo")
              for mg in mgfx_files:
                  conv = convert_mgfx_v9_to_v10(mg.read_bytes())
                  verify_mgfx_v10(conv)
                  mg.write_bytes(conv)
                  print("android shader v9->v10 OK:", mg.relative_to(root))

              # E. WobbleGame: dlopen, WorkingDirectory, HiDef + Fullscreen + Orientations, boot trace
              def patch_wobblegame_android(t):
                  old_dl = "if (RuntimeInformation.IsOSPlatform(OSPlatform.Linux))"
                  if t.count(old_dl) != 1:
                      sys.exit("PATCH FALLIDO (WobbleGame dlopen)")
                  t = t.replace(old_dl, "if (RuntimeInformation.IsOSPlatform(OSPlatform.Linux) && !global::System.OperatingSystem.IsAndroid())")

                  old_wd = "public static string WorkingDirectory => AppDomain.CurrentDomain.BaseDirectory;"
                  if t.count(old_wd) != 1:
                      sys.exit("PATCH FALLIDO (WobbleGame WorkingDirectory)")
                  t = t.replace(old_wd, "public static string WorkingDirectory { get; set; } = AppDomain.CurrentDomain.BaseDirectory;")

                  old_gfx = "PreferredDepthStencilFormat = DepthFormat.Depth24Stencil8,\n            };"
                  new_gfx = (
                      "PreferredDepthStencilFormat = DepthFormat.Depth24Stencil8,\n"
                      "            };\n\n"
                      "            if (global::System.OperatingSystem.IsAndroid())\n"
                      "            {\n"
                      "                Graphics.GraphicsProfile = GraphicsProfile.HiDef;\n"
                      "                Graphics.IsFullScreen = true;\n"
                      "                Graphics.SupportedOrientations = DisplayOrientation.LandscapeLeft | DisplayOrientation.LandscapeRight;\n"
                      "            }"
                  )
                  if t.count(old_gfx) != 1:
                      sys.exit("PATCH FALLIDO (WobbleGame Graphics)")
                  t = t.replace(old_gfx, new_gfx)

                  old_begin = (
                      "            var field = typeof(SpriteBatch).GetField(\"_beginCalled\", BindingFlags.Instance | BindingFlags.NonPublic);\n"
                      "            var getter = new DynamicMethod(nameof(_beginCalled), typeof(bool), new[] { typeof(SpriteBatch) }, true);\n"
                      "            var il = getter.GetILGenerator();\n\n"
                      "            il.Emit(OpCodes.Ldarg_0);\n"
                      "            il.Emit(OpCodes.Ldfld, field);\n"
                      "            il.Emit(OpCodes.Ret);\n\n"
                      "            _beginCalled = (Predicate<SpriteBatch>)getter.CreateDelegate(typeof(Predicate<SpriteBatch>));"
                  )
                  new_begin = (
                      "            var field = typeof(SpriteBatch).GetField(\"_beginCalled\", BindingFlags.Instance | BindingFlags.NonPublic);\n"
                      "            if (field == null)\n"
                      "            {\n"
                      "                _beginCalled = sb => false;\n"
                      "            }\n"
                      "            else\n"
                      "            {\n"
                      "                try\n"
                      "                {\n"
                      "                    var getter = new DynamicMethod(nameof(_beginCalled), typeof(bool), new[] { typeof(SpriteBatch) }, true);\n"
                      "                    var il = getter.GetILGenerator();\n"
                      "                    il.Emit(OpCodes.Ldarg_0);\n"
                      "                    il.Emit(OpCodes.Ldfld, field);\n"
                      "                    il.Emit(OpCodes.Ret);\n"
                      "                    _beginCalled = (Predicate<SpriteBatch>)getter.CreateDelegate(typeof(Predicate<SpriteBatch>));\n"
                      "                }\n"
                      "                catch\n"
                      "                {\n"
                      "                    _beginCalled = sb => sb != null && (bool)field.GetValue(sb);\n"
                      "                }\n"
                      "            }"
                  )
                  if t.count(old_begin) != 1:
                      sys.exit("PATCH FALLIDO (WobbleGame._beginCalled)")
                  t = t.replace(old_begin, new_begin)

                  old_init = 'Resources.AddStore(new DllResourceStore("Wobble.Resources.dll"));'
                  if t.count(old_init) != 1:
                      sys.exit("PATCH FALLIDO (WobbleGame.Initialize)")
                  t = t.replace(
                      old_init,
                      'global::Wobble.Logging.AndroidDiagnostics.Trace("WobbleGame.Initialize profile=" + GraphicsDevice?.GraphicsProfile);\n'
                      '            Resources.AddStore(new DllResourceStore("Wobble.Resources.dll"));',
                  )
                  return t

              rw(W / "WobbleGame.cs", patch_wobblegame_android)

