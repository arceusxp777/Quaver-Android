          </Project>
          XMLEOF
          cat > android-head/AndroidManifest.xml <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="org.communityport.quaverandroid">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application android:label="Quaver" android:icon="@drawable/icon" android:allowBackup="false" android:extractNativeLibs="true"></application>
          </manifest>
          XMLEOF
          cat > android-head/MainActivity.cs <<'CSEOF'
          using System;
          using System.IO;
          using System.Text;
          using Android.App;
          using Android.Content;
          using Android.Content.PM;
          using Android.OS;
          using Android.Views;
          using Android.Widget;
          using Microsoft.Xna.Framework;

          namespace QuaverAndroid
          {
              // PRIMERA CABECERA ANDROID de Quaver (comunitaria, NO oficial). PROVISIONAL: sin Steam, Discord,
              // IPC ni integracion nativa de escritorio. Si algo falla, muestra un informe copiable en pantalla.
              // Si el juego se queda colgado, pulsa BAJAR VOLUMEN para ver el registro de Quaver.
              [Activity(Label = "Quaver", Icon = "@drawable/icon", MainLauncher = true, LaunchMode = LaunchMode.SingleInstance,
                  ScreenOrientation = ScreenOrientation.SensorLandscape,
                  ConfigurationChanges = ConfigChanges.Orientation | ConfigChanges.Keyboard | ConfigChanges.KeyboardHidden | ConfigChanges.ScreenSize)]
              public class MainActivity : AndroidGameActivity
              {
                  private string _crashFile;

                  protected override void OnCreate(Bundle bundle)
                  {
                      base.OnCreate(bundle);

                      var dataDir = FilesDir.AbsolutePath;
                      _crashFile = Path.Combine(dataDir, "informe-fallo.txt");
                      HookCrashHandlers();

                      // Carga explicita de BASS nativo en Android (si existen en el paquete)
                      try
                      {
                          global::Java.Lang.JavaSystem.LoadLibrary("bass");
                          global::Java.Lang.JavaSystem.LoadLibrary("bass_fx");
                          Android.Util.Log.Info("QuaverAndroid", "BASS nativo cargado con exito.");
                      }
                      catch (System.Exception ex)
                      {
                          Android.Util.Log.Warn("QuaverAndroid", "Aviso BASS LoadLibrary: " + ex.Message);
                      }

                      // Precargar ensamblado de recursos Quaver.Resources en el AppDomain
                      try { System.Reflection.Assembly.Load("Quaver.Resources"); } catch { }

                      // Crear carpetas requeridas por Quaver
                      foreach (var dir in new[] { "Songs", "Skins", "Screenshots", "Replays", "Backup", "Logs" })
                      {
                          try { Directory.CreateDirectory(Path.Combine(dataDir, dir)); } catch { }
                      }

                      // Si el proceso anterior murio, se muestra su informe antes de volver a intentarlo.
                      if (File.Exists(_crashFile))
                      {
                          ShowReport(File.ReadAllText(_crashFile));
                          return;
                      }

                      try
                      {
                          StartQuaver(dataDir + "/");
                      }
                      catch (Exception e)
                      {
                          WriteReport(e, "arranque");
                          ShowReport(File.ReadAllText(_crashFile));
                      }
                  }

                  private void StartQuaver(string workDir)
                  {
                      Wobble.WobbleGame.WorkingDirectory = workDir;
                      Directory.SetCurrentDirectory(workDir);

                      InitSqlite();

                      Wobble.Logging.Logger.Initialize();
                      Quaver.Shared.Config.ConfigManager.Initialize();
                      Quaver.Shared.Config.StructuredConfigManager.Initialize();

                      System.Globalization.CultureInfo.DefaultThreadCurrentCulture = System.Globalization.CultureInfo.InvariantCulture;
                      System.Threading.Thread.CurrentThread.CurrentCulture = System.Globalization.CultureInfo.InvariantCulture;
                      System.Threading.Thread.CurrentThread.CurrentUICulture = System.Globalization.CultureInfo.InvariantCulture;

                      var game = new Quaver.Shared.QuaverGame();
                      SetContentView((View)game.Services.GetService(typeof(View)));
                      game.Run();
                  }

                  // sqlite-net necesita el proveedor SQLitePCLRaw inicializado en Android. Se llama por reflexion
                  // para no depender en compilacion de ese ensamblado.
                  private static void InitSqlite()
                  {
                      try
                      {
                          var type = Type.GetType("SQLitePCL.Batteries_V2, SQLitePCLRaw.batteries_v2");
                          var init = type == null ? null : type.GetMethod("Init", Type.EmptyTypes);
                          if (init != null)
                              init.Invoke(null, null);
                      }
                      catch (Exception e)
                      {
                          Android.Util.Log.Warn("QuaverAndroid", "SQLitePCL: " + e);
                      }
                  }

                  public override bool OnKeyDown(Keycode keyCode, KeyEvent e)
                  {
                      if (keyCode == Keycode.VolumeDown)
                      {
                          try
                          {
                              ShowReport(BuildLogText());
                          }
                          catch (Exception ex)
                          {
                              Android.Util.Log.Error("QuaverAndroid", ex.ToString());
                          }

                          return true;
                      }

                      return base.OnKeyDown(keyCode, e);
                  }

                  private void HookCrashHandlers()
                  {
                      AppDomain.CurrentDomain.UnhandledException += (s, e) => WriteReport(e.ExceptionObject as Exception, "AppDomain");
                      Android.Runtime.AndroidEnvironment.UnhandledExceptionRaiser += (s, e) => WriteReport(e.Exception, "Android");
                  }

                  private void WriteReport(Exception ex, string origin)
                  {
                      try
                      {
                          var sb = new StringBuilder();
                          sb.AppendLine("Quaver Android (comunitario) - informe de fallo");
                          sb.AppendLine("Origen: " + origin);
                          sb.AppendLine("Hora UTC: " + DateTime.UtcNow.ToString("u"));
                          sb.AppendLine("Dispositivo: " + Build.Manufacturer + " " + Build.Model + " / Android " + Build.VERSION.Release + " (API " + (int)Build.VERSION.SdkInt + ")");
                          sb.AppendLine();
                          sb.AppendLine(ex != null ? ex.ToString() : "(sin excepcion)");
                          File.WriteAllText(_crashFile, sb.ToString());
                          Android.Util.Log.Error("QuaverAndroid", sb.ToString());
                      }
                      catch
                      {
                          // Nada mas que hacer si ni siquiera se puede escribir el informe.
                      }
                  }

                  private static string ReadShared(string path)
                  {
                      using (var fs = new FileStream(path, FileMode.Open, FileAccess.Read, FileShare.ReadWrite))
                      using (var sr = new StreamReader(fs))
                          return sr.ReadToEnd();
                  }

                  private string BuildLogText()
                  {
                      var sb = new StringBuilder();
                      sb.AppendLine("Registro de Quaver (ultimas lineas de cada archivo)");

                      var dir = Path.Combine(FilesDir.AbsolutePath, "Logs");
                      if (!Directory.Exists(dir))
                      {
                          sb.AppendLine("(no existe la carpeta de registros: " + dir + ")");
                          return sb.ToString();
                      }

                      foreach (var file in Directory.GetFiles(dir, "*.log"))
                      {
                          string[] lines;
                          try
                          {
                              lines = ReadShared(file).Split(new[] { Convert.ToChar(10) });
                          }
                          catch (Exception e)
                          {
                              sb.AppendLine("No se pudo leer " + file + ": " + e.Message);
                              continue;
                          }

                          sb.AppendLine();
                          sb.AppendLine("=== " + Path.GetFileName(file) + " (" + lines.Length + " lineas) ===");
                          for (var i = Math.Max(0, lines.Length - 120); i < lines.Length; i++)
                              sb.AppendLine(lines[i].TrimEnd(Convert.ToChar(13)));
                      }

                      return sb.ToString();
                  }

                  private void ShowReport(string text)
                  {
                      var layout = new LinearLayout(this) { Orientation = Orientation.Vertical };
                      layout.SetPadding(32, 32, 32, 32);

                      var title = new TextView(this) { Text = "Quaver Android: informe" };
                      title.TextSize = 18;

                      var copy = new Button(this) { Text = "Copiar informe" };
                      copy.Click += (s, e) =>
                      {
                          var cm = (ClipboardManager)GetSystemService(ClipboardService);
                          cm.PrimaryClip = ClipData.NewPlainText("informe", text);
                          Toast.MakeText(this, "Informe copiado", ToastLength.Short).Show();
                      };

                      var close = new Button(this) { Text = "Borrar informe y cerrar" };
                      close.Click += (s, e) =>
                      {
                          try { File.Delete(_crashFile); } catch { }
                          Android.OS.Process.KillProcess(Android.OS.Process.MyPid());
                      };

                      var body = new TextView(this) { Text = text };
                      body.TextSize = 11;
                      body.SetTextIsSelectable(true);

                      layout.AddView(title);
                      layout.AddView(copy);
                      layout.AddView(close);
                      layout.AddView(body);

                      var scroll = new ScrollView(this);
                      scroll.AddView(layout);
                      SetContentView(scroll);
                  }
              }
          }
          CSEOF
      - name: BASS nativo (opcional, solo si subiste android-native-libs.zip a la raiz del fork)
        run: |
          mkdir -p android-head/native/arm64-v8a
          if [ -f android-native-libs.zip ]; then
            unzip -o -j android-native-libs.zip 'android-native-libs/arm64-v8a/*.so' -d android-head/native/arm64-v8a
            sha256sum android-head/native/arm64-v8a/*.so
          else
            echo "SIN BASS: no hay android-native-libs.zip en la raiz; el audio fallara al iniciar"
          fi
      - name: Dependencias del SDK de Android
        run: |
          set +e
          dotnet build android-head/QuaverAndroid.csproj -t:InstallAndroidDependencies -f net8.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True 2>&1 | tee head-deps.log
      - name: Build APK del juego (Debug, arm64)
        run: |
          mkdir -p head-out
          echo "Compilando QuaverAndroid.csproj (arm64)..."
          dotnet build android-head/QuaverAndroid.csproj -c Debug 2>&1 | tee head-build.log
          STATUS=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$STATUS" | tee -a head-build.log
          APK=$(find android-head/bin -name '*-Signed.apk' | head -n1); [ -z "$APK" ] && APK=$(find android-head/bin -name '*.apk' | head -n1)
          echo "APK elegido: $APK" | tee -a head-build.log
          if [ -n "$APK" ] && [ -f "$APK" ]; then
            cp "$APK" head-out/Quaver-android-dev.apk
            echo "EXITO: APK generado correctamente ($(du -h head-out/Quaver-android-dev.apk | cut -f1))"
            ls -la head-out | tee -a head-build.log
          else
            echo "::error::NO SE PUDO GENERAR EL APK DE QUAVER (codigo de salida $STATUS)"
            echo "=== ULTIMAS 120 LINEAS DEL LOG DE COMPILACION ==="
            tail -n 120 head-build.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-head
          path: |
            patch.log
            head-deps.log
            head-build.log
            head-out/*.apk
