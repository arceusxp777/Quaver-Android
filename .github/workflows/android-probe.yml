                  .replace('Logger.Important("Performing game initialization task...", LogType.Runtime);', 'global::Wobble.Logging.AndroidDiagnostics.Trace("InitScreenV2: PerformGameSetup start");\n            Logger.Important("Performing game initialization task...", LogType.Runtime);')
                  .replace('Logger.Important("Game initialization task complete!", LogType.Runtime);', 'global::Wobble.Logging.AndroidDiagnostics.Trace("InitScreenV2: complete -> MainMenu");\n            Logger.Important("Game initialization task complete!", LogType.Runtime);'),
              )

              # R. Correccion de errores/avisos de compilacion y protecciones extra en runtime Android
              # R1) CA1416: Registry solo en Windows en OtherGameMapDatabaseCache.cs
              def patch_other_db(t):
                  for sig in ("FindOsuStableInstallation()", "FindEtternaInstallation()"):
                      old_m = f"        public static void {sig}\n        {{\n            try"
                      new_m = f"        public static void {sig}\n        {{\n            if (!global::System.OperatingSystem.IsWindows())\n                return;\n\n            try"
                      if t.count(old_m) != 1:
                          sys.exit(f"PATCH FALLIDO (OtherGameMapDatabaseCache.{sig})")
                      t = t.replace(old_m, new_m)
                  return t
              rw(root / "Quaver.Shared" / "Database" / "Maps" / "OtherGameMapDatabaseCache.cs", patch_other_db)

              # R2) OnlineManager.Login(): evitar llamada nativa SteamUser.GetSteamID() en Android
              rw(
                  root / "Quaver.Shared" / "Online" / "OnlineManager.cs",
                  lambda t: t.replace(
                      "Client.Connect(SteamUser.GetSteamID().m_SteamID, SteamFriends.GetPersonaName(), false);",
                      "if (global::System.OperatingSystem.IsAndroid() && !SteamManager.IsInitialized)\n"
                      "            {\n"
                      '                Logger.Warning("Steam login skipped on Android (SteamManager not initialized).", LogType.Network);\n'
                      "                return;\n"
                      "            }\n"
                      "            Client.Connect(SteamUser.GetSteamID().m_SteamID, SteamFriends.GetPersonaName(), false);",
                  ),
              )

              # R3) MSB3568: deduplicar claves repetidas (case-insensitive) en Strings*.resx
              resx_fixed = 0
              data_pat = re.compile(r'\s*<data\s+name="([^"]+)"[^>]*>.*?</data>', re.S)
              for resx in sorted((root / "Quaver.Shared" / "Localization").glob("Strings*.resx")):
                  rt = resx.read_text(encoding="utf-8-sig")
                  seen_keys = set()
                  removed_keys = []
                  def dedup_data(m):
                      k = m.group(1).lower()
                      if k in seen_keys:
                          removed_keys.append(m.group(1))
                          return ""
                      seen_keys.add(k)
                      return m.group(0)
                  nt = data_pat.sub(dedup_data, rt)
                  if nt != rt:
                      resx.write_text(nt, encoding="utf-8")
                      resx_fixed += 1
              print(f"android: MSB3568 deduplicado en {resx_fixed} archivos .resx")

              # R4) CS0642 (sentencia vacia accidental) y CS0162 (codigo inalcanzable)
              rw(
                  root / "Quaver.Shared" / "Screens" / "Multiplayer" / "UI" / "MenuFooterMultiplayer.cs",
                  lambda t: t.replace(
                      "if (!RightAligned.Contains(ChangeTeam)) ;\n                RightAligned.Add(ChangeTeam);",
                      "if (!RightAligned.Contains(ChangeTeam))\n                    RightAligned.Add(ChangeTeam);",
                  ),
              )
              rw(
                  root / "Quaver.Shared" / "Database" / "Scores" / "ScoreDatabaseCache.cs",
                  lambda t: t.replace(
                      "            catch (Exception e)\n            {\n                Logger.Error(e, LogType.Runtime);\n                throw;\n            }\n\n            return -1;",
                      "            catch (Exception e)\n            {\n                Logger.Error(e, LogType.Runtime);\n                throw;\n            }",
                  ),
              )

              # R5) Trazas de Shader, QuaverGame.LoadContent y cambio de pantalla
              rw(
                  W / "Graphics" / "Shaders" / "Shader.cs",
                  lambda t: t.replace(
                      "            ShaderEffect = new Effect(GameBase.Game.GraphicsDevice, data);",
                      "            try\n            {\n                ShaderEffect = new Effect(GameBase.Game.GraphicsDevice, data);\n            }\n            catch (Exception ex)\n            {\n                global::Wobble.Logging.AndroidDiagnostics.Fatal(\"Shader\", ex);\n                throw;\n            }",
                  ),
              )
              rw(
                  root / "Quaver.Shared" / "QuaverGame.cs",
                  lambda t: t.replace(
                      'Logger.Important($"Currently running Quaver version: `{Version}`", LogType.Runtime);',
                      'global::Wobble.Logging.AndroidDiagnostics.Trace("QuaverGame.LoadContent gd=" + (GraphicsDevice != null) + " adapter=" + GraphicsDevice?.Adapter?.Description);\n            Logger.Important($"Currently running Quaver version: `{Version}`", LogType.Runtime);',
                  ),
              )
              rw(
                  root / "Quaver.Shared" / "Screens" / "QuaverScreenManager.cs",
                  lambda t: t.replace(
                      "ScreenManager.ChangeScreen(screen, retainedElements, switchImmediately);",
                      'global::Wobble.Logging.AndroidDiagnostics.Trace("ChangeScreen -> " + screen.Type);\n                ScreenManager.ChangeScreen(screen, retainedElements, switchImmediately);',
                  ),
              )

          print("PATCH COMPLETO v18 OK")
          PY
      - name: Workload android y paquete MonoGame para Android
        run: |
          dotnet workload install android 2>&1 | tail -n 10
          dotnet add Wobble/Wobble/Wobble.csproj package MonoGame.Framework.Android --version 3.8.1.303 2>&1 | tail -n 5
      - name: BASS nativo arm64 (zip local o descarga oficial Un4seen)
        run: |
          mkdir -p android-head/native/arm64-v8a
          if [ -f android-native-libs.zip ]; then
            echo "Extrayendo libs desde android-native-libs.zip..."
            unzip -o -j android-native-libs.zip '*arm64-v8a/libbass*.so' -d android-head/native/arm64-v8a || true
          fi
          if [ ! -s android-head/native/arm64-v8a/libbass.so ]; then
            echo "Descargando libbass.so oficial (Un4seen Android arm64)..."
            curl -fsSL -o /tmp/bass24-android.zip https://www.un4seen.com/files/bass24-android.zip
            unzip -o -j /tmp/bass24-android.zip 'libs/arm64-v8a/libbass.so' -d android-head/native/arm64-v8a
          fi
          if [ ! -s android-head/native/arm64-v8a/libbass_fx.so ]; then
            echo "Descargando libbass_fx.so oficial (Un4seen Android arm64)..."
            curl -fsSL -o /tmp/bass_fx24-android.zip https://www.un4seen.com/files/z/0/bass_fx24-android.zip
            unzip -o -j /tmp/bass_fx24-android.zip 'libs/arm64-v8a/libbass_fx.so' -d android-head/native/arm64-v8a
          fi
          ls -lh android-head/native/arm64-v8a/
          file android-head/native/arm64-v8a/*.so
          sha256sum android-head/native/arm64-v8a/*.so
      - name: Crear cabecera Android v18
        run: |
          mkdir -p android-head/Resources/drawable android-head/Resources/mipmap-xxxhdpi
          cp Quaver.Resources/Quaver.Resources/Icons/quaver-logo.png android-head/Resources/drawable/icon.png
          cp Quaver.Resources/Quaver.Resources/Icons/quaver-logo.png android-head/Resources/mipmap-xxxhdpi/icon.png
          cat > android-head/QuaverAndroid.csproj <<'XMLEOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0-android</TargetFramework>
              <OutputType>Exe</OutputType>
              <RootNamespace>QuaverAndroid</RootNamespace>
              <AssemblyName>QuaverAndroid</AssemblyName>
              <SupportedOSPlatformVersion>24</SupportedOSPlatformVersion>
              <ApplicationId>org.communityport.quaverandroid</ApplicationId>
              <ApplicationVersion>1</ApplicationVersion>
              <ApplicationDisplayVersion>0.0.1-dev</ApplicationDisplayVersion>
              <RuntimeIdentifiers>android-arm64</RuntimeIdentifiers>
              <AndroidPackageFormat>apk</AndroidPackageFormat>
              <EmbedAssembliesIntoApk>true</EmbedAssembliesIntoApk>
              <Nullable>disable</Nullable>
              <ImplicitUsings>disable</ImplicitUsings>
              <LangVersion>latest</LangVersion>
              <NoWarn>$(NoWarn);NU1902;NU1903;NU1701</NoWarn>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="MonoGame.Framework.Android" Version="3.8.1.303" />
              <PackageReference Include="SkiaSharp" Version="3.119.0" />
              <PackageReference Include="SkiaSharp.NativeAssets.Android" Version="3.119.0" />
              <PackageReference Include="SQLitePCLRaw.bundle_green" Version="2.1.11" />
              <PackageReference Include="SQLitePCLRaw.lib.e_sqlite3.android" Version="2.1.11" />
              <ProjectReference Include="../Quaver.Shared/Quaver.Shared.csproj" />
              <ProjectReference Include="../Quaver.Resources/Quaver.Resources.csproj" />
              <ProjectReference Include="../Wobble/Wobble.Resources/Wobble.Resources.csproj" />
            </ItemGroup>
            <ItemGroup>
              <AndroidAsset Include="../Quaver.Shared/Content/**/*" Link="Assets/Content/%(RecursiveDir)%(Filename)%(Extension)" />
              <AndroidNativeLibrary Remove="native/**/*.so" />
              <AndroidNativeLibrary Remove="**/libsteam_api.so" />
            </ItemGroup>
            <ItemGroup Condition="Exists('native/arm64-v8a/libbass.so')">
              <AndroidNativeLibrary Include="native/arm64-v8a/libbass.so">
                <Abi>arm64-v8a</Abi>
              </AndroidNativeLibrary>
              <AndroidNativeLibrary Include="native/arm64-v8a/libbass_fx.so">
                <Abi>arm64-v8a</Abi>
              </AndroidNativeLibrary>
            </ItemGroup>
          </Project>
          XMLEOF
          cat > android-head/AndroidManifest.xml <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="org.communityport.quaverandroid">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            <uses-feature android:glEsVersion="0x00020000" android:required="true" />
            <application android:label="Quaver" android:icon="@drawable/icon" android:allowBackup="false" android:hardwareAccelerated="true" android:extractNativeLibs="true"></application>
          </manifest>
          XMLEOF
          cat > android-head/MainActivity.cs <<'CSEOF'
          using System;
          using System.IO;
          using System.Text;
          using System.Threading.Tasks;
          using Android.App;
          using Android.Content;
          using Android.Content.PM;
          using Android.OS;
          using Android.Views;
          using Android.Widget;
          using Microsoft.Xna.Framework;
          using Wobble.Logging;

          namespace QuaverAndroid
          {
              [Activity(Label = "Quaver", Icon = "@drawable/icon", MainLauncher = true, LaunchMode = LaunchMode.SingleInstance,
                  ScreenOrientation = ScreenOrientation.SensorLandscape,
                  ConfigurationChanges = ConfigChanges.Orientation | ConfigChanges.Keyboard | ConfigChanges.KeyboardHidden | ConfigChanges.ScreenSize)]
              public class MainActivity : AndroidGameActivity
              {
                  private string _crashFile;
                  private Quaver.Shared.QuaverGame _game;

                  protected override void OnCreate(Bundle bundle)
                  {
                      base.OnCreate(bundle);
                      Window?.AddFlags(WindowManagerFlags.KeepScreenOn | WindowManagerFlags.Fullscreen);

                      var dataDir = FilesDir.AbsolutePath;
                      Wobble.WobbleGame.WorkingDirectory = dataDir + "/";
                      _crashFile = Path.Combine(dataDir, "informe-fallo.txt");
                      HookCrashHandlers();

                      AndroidDiagnostics.Trace("01.OnCreate dataDir=" + dataDir);

                      foreach (var lib in new[] { "bass", "bass_fx", "e_sqlite3", "SkiaSharp", "freetype", "openal32" })
                      {
                          try
                          {
                              global::Java.Lang.JavaSystem.LoadLibrary(lib);
                              AndroidDiagnostics.Trace("LoadLibrary OK: " + lib);
                          }
                          catch (Exception ex)
                          {
                              AndroidDiagnostics.Trace("LoadLibrary WARN " + lib + ": " + ex.Message);
                          }
                      }

                      foreach (var asm in new[] { "Quaver.Resources", "Wobble.Resources" })
                      {
                          try
                          {
                              System.Reflection.Assembly.Load(asm);
                              AndroidDiagnostics.Trace("Assembly.Load OK: " + asm);
                          }
                          catch (Exception ex)
                          {
                              AndroidDiagnostics.Trace("Assembly.Load WARN " + asm + ": " + ex.Message);
                          }
                      }

                      foreach (var dir in new[] { "Songs", "Skins", "Screenshots", "Replays", "Backup", "Logs" })
                      {
                          try { Directory.CreateDirectory(Path.Combine(dataDir, dir)); } catch { }
                      }

                      if (File.Exists(_crashFile))
                      {
                          ShowReport(File.ReadAllText(_crashFile));
                          return;
                      }

                      try
                      {
                          StartQuaver(dataDir + "/");
                      }
                      catch (Exception e)
                      {
                          WriteReport(e, "arranque");
                          ShowReport(File.Exists(_crashFile) ? File.ReadAllText(_crashFile) : e.ToString());
                      }
                  }

                  private void StartQuaver(string workDir)
                  {
                      Wobble.WobbleGame.WorkingDirectory = workDir;
                      Directory.SetCurrentDirectory(workDir);

                      AndroidDiagnostics.Trace("02.Batteries_V2.Init");
                      SQLitePCL.Batteries_V2.Init();

                      AndroidDiagnostics.Trace("03.ConfigManager.Initialize");
                      Wobble.Logging.Logger.Initialize();
                      Quaver.Shared.Config.ConfigManager.Initialize();
                      Quaver.Shared.Config.StructuredConfigManager.Initialize();

                      System.Globalization.CultureInfo.DefaultThreadCurrentCulture = System.Globalization.CultureInfo.InvariantCulture;
                      System.Threading.Thread.CurrentThread.CurrentCulture = System.Globalization.CultureInfo.InvariantCulture;
                      System.Threading.Thread.CurrentThread.CurrentUICulture = System.Globalization.CultureInfo.InvariantCulture;

                      AndroidDiagnostics.Trace("04.new QuaverGame");
                      _game = new Quaver.Shared.QuaverGame();
                      var view = (View)_game.Services.GetService(typeof(View));
                      AndroidDiagnostics.Trace("05.SetContentView view=" + (view != null));
                      SetContentView(view);
                      AndroidDiagnostics.Trace("06.game.Run()");
                      _game.Run();
                  }

                  public override bool DispatchKeyEvent(KeyEvent e)
                  {
                      if (e != null && e.KeyCode == Keycode.VolumeDown && e.Action == KeyEventActions.Down)
                      {
                          try
                          {
                              ShowReport(BuildLogText());
                          }
                          catch (Exception ex)
                          {
                              Android.Util.Log.Error("QuaverAndroid", ex.ToString());
                          }
                          return true;
                      }

                      return base.DispatchKeyEvent(e);
                  }

                  private void HookCrashHandlers()
                  {
                      AppDomain.CurrentDomain.UnhandledException += (s, e) => WriteReport(e.ExceptionObject as Exception, "AppDomain");
                      Android.Runtime.AndroidEnvironment.UnhandledExceptionRaiser += (s, e) => WriteReport(e.Exception, "Android");
                      TaskScheduler.UnobservedTaskException += (s, e) =>
                      {
                          WriteReport(e.Exception, "UnobservedTask");
                          e.SetObserved();
                      };
                      AndroidDiagnostics.OnFatal += msg =>
                      {
                          WriteTextReport("TaskHandler/Fatal", msg);
                          try
                          {
                              RunOnUiThread(() => ShowReport(BuildLogText() + "\n\n=== EXCEPCION ===\n" + msg));
                          }
                          catch
                          {
                          }
                      };
                  }

                  private void WriteTextReport(string origin, string body)
                  {
                      try
                      {
                          var sb = new StringBuilder();
                          sb.AppendLine("Quaver Android (comunitario) - informe de fallo");
                          sb.AppendLine("Origen: " + origin);
                          sb.AppendLine("Hora UTC: " + DateTime.UtcNow.ToString("u"));
                          sb.AppendLine("Dispositivo: " + Build.Manufacturer + " " + Build.Model + " / Android " + Build.VERSION.Release + " (API " + (int)Build.VERSION.SdkInt + ")");
                          sb.AppendLine();
                          sb.AppendLine(body);
                          File.WriteAllText(_crashFile, sb.ToString());
                          Android.Util.Log.Error("QuaverAndroid", sb.ToString());
                      }
                      catch
                      {
                      }
                  }

                  private void WriteReport(Exception ex, string origin) =>
                      WriteTextReport(origin, ex != null ? ex.ToString() : "(sin excepcion)");

                  private static string ReadShared(string path)
                  {
                      using (var fs = new FileStream(path, FileMode.Open, FileAccess.Read, FileShare.ReadWrite))
                      using (var sr = new StreamReader(fs))
                          return sr.ReadToEnd();
                  }

                  private string BuildLogText()
                  {
                      var sb = new StringBuilder();
                      sb.AppendLine("Registro de Quaver Android (boot-trace + Logs)");

                      var dir = Path.Combine(FilesDir.AbsolutePath, "Logs");
                      if (!Directory.Exists(dir))
                      {
                          sb.AppendLine("(no existe la carpeta de registros: " + dir + ")");
                          return sb.ToString();
                      }

                      foreach (var file in Directory.GetFiles(dir, "*.log"))
                      {
                          string[] lines;
                          try
                          {
                              lines = ReadShared(file).Split(new[] { Convert.ToChar(10) });
                          }
                          catch (Exception e)
                          {
                              sb.AppendLine("No se pudo leer " + file + ": " + e.Message);
                              continue;
                          }

                          sb.AppendLine();
                          sb.AppendLine("=== " + Path.GetFileName(file) + " (" + lines.Length + " lineas) ===");
                          for (var i = Math.Max(0, lines.Length - 120); i < lines.Length; i++)
                              sb.AppendLine(lines[i].TrimEnd(Convert.ToChar(13)));
                      }

                      return sb.ToString();
                  }

                  private void ShowReport(string text)
                  {
                      var layout = new LinearLayout(this) { Orientation = Orientation.Vertical };
                      layout.SetPadding(32, 32, 32, 32);

                      var title = new TextView(this) { Text = "Quaver Android: informe" };
                      title.TextSize = 18;

                      var copy = new Button(this) { Text = "Copiar informe" };
                      copy.Click += (s, e) =>
                      {
                          var cm = (ClipboardManager)GetSystemService(ClipboardService);
                          cm.PrimaryClip = ClipData.NewPlainText("informe", text);
                          Toast.MakeText(this, "Informe copiado", ToastLength.Short).Show();
                      };

                      var close = new Button(this) { Text = "Borrar informe y cerrar" };
                      close.Click += (s, e) =>
                      {
                          try { File.Delete(_crashFile); } catch { }
                          Android.OS.Process.KillProcess(Android.OS.Process.MyPid());
                      };

                      var body = new TextView(this) { Text = text };
                      body.TextSize = 11;
                      body.SetTextIsSelectable(true);

                      layout.AddView(title);
                      layout.AddView(copy);
                      layout.AddView(close);
                      layout.AddView(body);

                      var scroll = new ScrollView(this);
                      scroll.AddView(layout);
                      SetContentView(scroll);
                  }
              }
          }
          CSEOF
      - name: Dependencias del SDK de Android
        run: |
          set +e
          dotnet build android-head/QuaverAndroid.csproj -t:InstallAndroidDependencies -f net8.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True 2>&1 | tee head-deps.log
      - name: Build APK del juego (Debug, arm64) y verificacion de binarios nativos
        run: |
          mkdir -p head-out
          echo "Compilando QuaverAndroid.csproj (arm64)..."
          python3 scripts/fix_warnings.py .
          dotnet build android-head/QuaverAndroid.csproj -c Debug 2>&1 | tee head-build.log
          STATUS=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$STATUS" | tee -a head-build.log
          APK=$(find android-head/bin -name '*-Signed.apk' | head -n1); [ -z "$APK" ] && APK=$(find android-head/bin -name '*.apk' | head -n1)
          echo "APK elegido: $APK" | tee -a head-build.log
          if [ -n "$APK" ] && [ -f "$APK" ]; then
            cp "$APK" head-out/Quaver-android-dev.apk
            echo "EXITO: APK generado ($(du -h head-out/Quaver-android-dev.apk | cut -f1))"
            echo "=== CONTENIDO NATIVO ARM64 EN EL APK ===" | tee -a head-build.log
            unzip -l head-out/Quaver-android-dev.apk | grep -E 'lib/arm64-v8a/|assets/Content/' | tee -a head-build.log
            for req in libbass.so libbass_fx.so libe_sqlite3.so libSkiaSharp.so libfreetype.so libopenal32.so; do
              if ! unzip -l head-out/Quaver-android-dev.apk | grep -q "lib/arm64-v8a/$req"; then
                echo "::error::FALTA $req dentro de lib/arm64-v8a/ en el APK!" | tee -a head-build.log
                exit 1
              fi
            done
            if unzip -l head-out/Quaver-android-dev.apk | grep -q "lib/arm64-v8a/libsteam_api.so"; then
              echo "::warning::libsteam_api.so de escritorio quedo incluido en lib/arm64-v8a/" | tee -a head-build.log
            fi
            for wcode in XA4301 CA1416 NU1903 MSB3568 CS0642 CS0162 CS0659 CS0108 CS0114 CS8625 CS8765 CS1634; do
              WCNT=$(grep -c "$wcode" head-build.log || true)
              echo "RESUMEN $wcode: $WCNT" | tee -a head-build.log
            done
            echo "TODAS LAS LIBRERIAS NATIVAS VERIFICADAS EN EL APK." | tee -a head-build.log
          else
            echo "::error::NO SE PUDO GENERAR EL APK DE QUAVER (codigo de salida $STATUS)"
            grep -iE 'error [A-Z0-9]+:|FAILED' head-build.log | head -n 40 || true
            tail -n 120 head-build.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-head
          path: |
            patch.log
            head-deps.log
            head-build.log
            head-out/*.apk
