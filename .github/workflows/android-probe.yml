                  .replace('Logger.Important("Loading skin...", LogType.Runtime);', 'global::Wobble.Logging.AndroidDiagnostics.Trace("InitScreenV2: Loading skin");\n            Logger.Important("Loading skin...", LogType.Runtime);')
                  .replace('Logger.Important("Performing game initialization task...", LogType.Runtime);', 'global::Wobble.Logging.AndroidDiagnostics.Trace("InitScreenV2: PerformGameSetup start");\n            Logger.Important("Performing game initialization task...", LogType.Runtime);')
                  .replace('Logger.Important("Game initialization task complete!", LogType.Runtime);', 'global::Wobble.Logging.AndroidDiagnostics.Trace("InitScreenV2: complete -> MainMenu");\n            Logger.Important("Game initialization task complete!", LogType.Runtime);'),
              )

              # R. Correccion de errores/avisos de compilacion y protecciones extra en runtime Android
              # R1) CA1416: Registry solo en Windows en OtherGameMapDatabaseCache.cs
              def patch_other_db(t):
                  for sig in ("FindOsuStableInstallation()", "FindEtternaInstallation()"):
                      old_m = f"        public static void {sig}\n        {{\n            try"
                      new_m = f"        public static void {sig}\n        {{\n            if (!global::System.OperatingSystem.IsWindows())\n                return;\n\n            try"
                      if t.count(old_m) != 1:
                          sys.exit(f"PATCH FALLIDO (OtherGameMapDatabaseCache.{sig})")
                      t = t.replace(old_m, new_m)
                  return t
              rw(root / "Quaver.Shared" / "Database" / "Maps" / "OtherGameMapDatabaseCache.cs", patch_other_db)

              # R2) OnlineManager.Login(): evitar llamada nativa SteamUser.GetSteamID() en Android
              rw(
                  root / "Quaver.Shared" / "Online" / "OnlineManager.cs",
                  lambda t: t.replace(
                      "Client.Connect(SteamUser.GetSteamID().m_SteamID, SteamFriends.GetPersonaName(), false);",
                      "if (global::System.OperatingSystem.IsAndroid() && !SteamManager.IsInitialized)\n"
                      "            {\n"
                      '                Logger.Warning("Steam login skipped on Android (SteamManager not initialized).", LogType.Network);\n'
                      "                return;\n"
                      "            }\n"
                      "            Client.Connect(SteamUser.GetSteamID().m_SteamID, SteamFriends.GetPersonaName(), false);",
                  ),
              )

              # R3) MSB3568: deduplicar claves repetidas (case-insensitive) en Strings*.resx
              resx_fixed = 0
              data_pat = re.compile(r'\s*<data\s+name="([^"]+)"[^>]*>.*?</data>', re.S)
              for resx in sorted((root / "Quaver.Shared" / "Localization").glob("Strings*.resx")):
                  rt = resx.read_text(encoding="utf-8-sig")
                  seen_keys = set()
                  removed_keys = []
                  def dedup_data(m):
                      k = m.group(1).lower()
                      if k in seen_keys:
                          removed_keys.append(m.group(1))
                          return ""
                      seen_keys.add(k)
                      return m.group(0)
                  nt = data_pat.sub(dedup_data, rt)
                  if nt != rt:
                      resx.write_text(nt, encoding="utf-8")
                      resx_fixed += 1
              print(f"android: MSB3568 deduplicado en {resx_fixed} archivos .resx")

              # R4) CS0642 (sentencia vacia accidental) y CS0162 (codigo inalcanzable)
              rw(
                  root / "Quaver.Shared" / "Screens" / "Multiplayer" / "UI" / "MenuFooterMultiplayer.cs",
                  lambda t: t.replace(
                      "if (!RightAligned.Contains(ChangeTeam)) ;\n                RightAligned.Add(ChangeTeam);",
                      "if (!RightAligned.Contains(ChangeTeam))\n                    RightAligned.Add(ChangeTeam);",
                  ),
              )
              rw(
                  root / "Quaver.Shared" / "Database" / "Scores" / "ScoreDatabaseCache.cs",
                  lambda t: t.replace(
                      "            catch (Exception e)\n            {\n                Logger.Error(e, LogType.Runtime);\n                throw;\n            }\n\n            return -1;",
                      "            catch (Exception e)\n            {\n                Logger.Error(e, LogType.Runtime);\n                throw;\n            }",
                  ),
              )

              # R5) Trazas de Shader, QuaverGame.LoadContent y cambio de pantalla
              rw(
                  W / "Graphics" / "Shaders" / "Shader.cs",
                  lambda t: t.replace(
                      "            ShaderEffect = new Effect(GameBase.Game.GraphicsDevice, data);",
                      "            try\n            {\n                ShaderEffect = new Effect(GameBase.Game.GraphicsDevice, data);\n            }\n            catch (Exception ex)\n            {\n                global::Wobble.Logging.AndroidDiagnostics.Fatal(\"Shader\", ex);\n                throw;\n            }",
                  ),
              )
              rw(
                  root / "Quaver.Shared" / "QuaverGame.cs",
                  lambda t: t.replace(
                      'Logger.Important($"Currently running Quaver version: `{Version}`", LogType.Runtime);',
                      'global::Wobble.Logging.AndroidDiagnostics.Trace("QuaverGame.LoadContent gd=" + (GraphicsDevice != null) + " adapter=" + GraphicsDevice?.Adapter?.Description);\n            Logger.Important($"Currently running Quaver version: `{Version}`", LogType.Runtime);',
                  ),
              )
              rw(
                  root / "Quaver.Shared" / "Screens" / "QuaverScreenManager.cs",
                  lambda t: t.replace(
                      "ScreenManager.ChangeScreen(screen, retainedElements, switchImmediately);",
                      'global::Wobble.Logging.AndroidDiagnostics.Trace("ChangeScreen -> " + screen.Type);\n                ScreenManager.ChangeScreen(screen, retainedElements, switchImmediately);',
                  ),
              )

          print("PATCH COMPLETO v18 OK")
          PY
      - name: Workload android y paquete MonoGame para Android
        run: |
          set +e
          dotnet workload install android 2>&1 | tee android-workload.log
          dotnet add Wobble/Wobble/Wobble.csproj package MonoGame.Framework.Android --version 3.8.1.303 2>&1 | tee -a android-workload.log
      - name: Build Wobble (net8.0-android)
