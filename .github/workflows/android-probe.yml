# Sondas de diagnostico (NO generan APK). Ejecutar a mano desde Actions.
#  baseline         : Quaver de escritorio tal cual, con los submodulos reales.
#  upstream-patched : escritorio contra MonoGame UPSTREAM (NuGet) + parche PROVISIONAL.
#  android-probe    : Wobble y Quaver.Shared como net8.0-android (solo para listar errores de C#).
name: android-probe-v15

on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Submodulos (como en el README, sin Server.Client)
        run: git -c submodule."Quaver.Server.Client".update=none submodule update --init --recursive
      - name: Versiones y commits efectivos
        run: |
          dotnet --info | tee versions.log
          git submodule status | tee -a versions.log
          git rev-parse HEAD | tee -a versions.log
      - name: Build de escritorio (Debug)
        run: |
          set +e
          cd Quaver
          dotnet build 2>&1 | tee ../build.log
          echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" | tee -a ../build.log
      - name: Tests de Quaver.API (net6.0 -> roll-forward al runtime disponible)
        continue-on-error: true
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          set +e
          dotnet test Quaver.API/Quaver.API.Tests 2>&1 | tee test-api.log
          echo "TEST_EXIT_CODE=${PIPESTATUS[0]}" | tee -a test-api.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-logs
          path: |
            versions.log
            build.log
            test-api.log

  upstream-patched:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Submodulos
        run: git -c submodule."Quaver.Server.Client".update=none submodule update --init --recursive
      - name: Parche PROVISIONAL para MonoGame upstream
        run: |
          python3 - . <<'PY' 2>&1 | tee patch.log
          """PROVISIONAL (solo sonda de CI). Adapta Wobble/Quaver para compilar contra MonoGame
          upstream (NuGet) en lugar del fork binario de Quaver. Falla con error claro si algun
          patron no se encuentra (p.ej. si el commit de Wobble cambia)."""
          import re, sys, pathlib

          print("patch_upstream v10")

          root = pathlib.Path(sys.argv[1] if len(sys.argv) > 1 else ".")
          W = root / "Wobble" / "Wobble"

          def rw(path, fn):
              t = path.read_text(encoding="utf-8-sig")
              n = fn(t)
              if n == t:
                  sys.exit(f"PATCH FALLIDO: sin cambios en {path}")
              path.write_text(n, encoding="utf-8")
              print("parcheado:", path.relative_to(root))

          # 1) Quitar la DLL propia de MonoGame de todos los csproj
          ref = re.compile(r'\s*<Reference Include="MonoGame\.Framework">.*?</Reference>', re.S)
          for p in root.rglob("*.csproj"):
              t = p.read_text(encoding="utf-8-sig")
              n = ref.sub("", t)
              if n != t:
                  p.write_text(n, encoding="utf-8"); print("csproj sin DLL propia:", p.relative_to(root))

          # 2) Game(bool preferWayland) no existe en upstream: ctor sin argumentos (parametro ignorado)
          def wobblegame(t):
              t = t.replace(": base(preferWayland)", ": base()")
              # WaylandVsync solo existe en el Game del fork: propiedad sin efecto (PROVISIONAL)
              return re.sub(r"(public abstract class WobbleGame : Game\s*\{)",
                            r"\1\n        public bool WaylandVsync { get; set; } // PROVISIONAL: sin efecto fuera del fork\n", t, count=1)
          rw(W / "WobbleGame.cs", wobblegame)

          # 3) Portapapeles: upstream no tiene Game.Get/SetClipboardText. STUB en memoria (PROVISIONAL).
          rw(W / "Platform" / "Linux" / "SdlClipboard.cs", lambda t: re.sub(
              r"public override string GetText\(\).*?;\s*public override void SetText\(string selectedText\).*?;",
              "private static string _text = \"\"; // PROVISIONAL: portapapeles solo en memoria\n"
              "        public override string GetText() => _text;\n\n"
              "        public override void SetText(string selectedText) => _text = selectedText ?? \"\";",
              t, flags=re.S))

          # 4) Teclas solo del fork (AZERTY): se eliminan sus nombres de visualizacion
          bad = "Asterisk|Squared|OemColon|OemCloseParenthesis|OemExclamationMark|Caret|DollarSign|PunctuatedU"
          case = re.compile(r'\s*case Keys\.(?:%s):\s*(?:keyStr = "[^"]*";\s*)?return [^;]*;' % bad)
          def keys(t):
              n, c = case.subn("", t)
              if c != 8: sys.exit(f"PATCH FALLIDO: se esperaban 8 'case' y hay {c}")
              return n
          rw(W / "Helpers" / "XnaKeyHelper.cs", keys)

          # 5) SpriteBatch.Draw con destino RectangleF (sobrecarga del fork) -> extension equivalente
          ext = W / "Graphics" / "SpriteBatchRectangleFExtensions.cs"
          ext.write_text('''using Microsoft.Xna.Framework;
          using Microsoft.Xna.Framework.Graphics;
          using MonoGame.Extended;

          namespace Wobble.Graphics
          {
              // PROVISIONAL: sustituye la sobrecarga Draw(..., RectangleF, ...) del fork de MonoGame.
              // Equivalente a Draw con rectangulo destino: posicion = (X,Y), escala = destino/origen,
              // 'origin' en pixeles de textura.
              public static class SpriteBatchRectangleFExtensions
              {
                  public static void Draw(this SpriteBatch sb, Texture2D texture, RectangleF destination,
                      Rectangle? source, Color color, float rotation, Vector2 origin, SpriteEffects effects, float layerDepth)
                  {
                      var sw = source?.Width ?? texture.Width;
                      var sh = source?.Height ?? texture.Height;
                      var scale = new Vector2(sw == 0 ? 0 : destination.Width / sw, sh == 0 ? 0 : destination.Height / sh);
                      sb.Draw(texture, new Vector2(destination.X, destination.Y), source, color, rotation, origin, scale, effects, layerDepth);
                  }
              }
          }
          ''', encoding="utf-8")
          print("creado:", ext.relative_to(root))

          # 6) GameWindow.FileDropped solo existe en el fork de MonoGame.
          #    Se redirige a un evento estatico que NUNCA se dispara (PROVISIONAL: sin arrastrar y soltar).
          (W / "Platform" / "FileDropCompat.cs").write_text('''using System;

          namespace Wobble.Platform
          {
              // PROVISIONAL: sustituye GameWindow.FileDropped del fork. No se dispara nunca.
              public static class FileDropCompat
              {
                  public static event EventHandler<string> FileDropped { add { } remove { } }
              }
          }
          ''', encoding="utf-8")
          print("creado: Wobble/Wobble/Platform/FileDropCompat.cs")
          drop = re.compile(r"(?:GameBase\.Game\.)?\bWindow\.FileDropped")
          total = 0
          for f in (root / "Quaver.Shared").rglob("*.cs"):
              t = f.read_text(encoding="utf-8-sig")
              n, c = drop.subn("Wobble.Platform.FileDropCompat.FileDropped", t)
              if c:
                  f.write_text(n, encoding="utf-8"); total += c
          if total != 13: sys.exit(f"PATCH FALLIDO: se esperaban 13 usos de FileDropped y hay {total}")
          print("FileDropped redirigido en", total, "sitios")

          # 7) Modo --android (SONDA): Wobble, Wobble.Extended y Quaver.Shared como net8.0-android y
          #    sin los binarios nativos de escritorio (.so/.dll/.dylib/x64/*), que rompen el empaquetado
          #    de Android (XA4301). NO anade soporte real de audio/Steam: es solo para ver errores de C#.
          if "--android" in sys.argv:
              nat = re.compile(r'\s*<None Update="(?:[^"]*\.(?:so|dll|dylib)|x64/\*)">.*?</None>', re.S)
              for rel in ("Wobble/Wobble/Wobble.csproj", "Wobble/Wobble.Extended/Wobble.Extended.csproj",
                          "Quaver.Shared/Quaver.Shared.csproj"):
                  p = root / rel
                  t = p.read_text(encoding="utf-8-sig")
                  n = t.replace("<TargetFramework>net8.0</TargetFramework>", "<TargetFramework>net8.0-android</TargetFramework>")
                  n, removed = nat.subn("", n)
                  # 'None Update' no saca los archivos del glob por defecto; el SDK de Android sigue viendo
                  # los *.so como bibliotecas nativas sin ABI (XA4301). Se eliminan del glob (CI ronda 4).
                  n = n.replace("</Project>", """  <ItemGroup>
              <None Remove="x64/**" />
              <None Remove="**/*.so" />
              <None Remove="**/*.dylib" />
              <None Remove="**/*.dll" />
            </ItemGroup>
          </Project>""")
                  if n == t: sys.exit(f"PATCH FALLIDO (--android): sin cambios en {rel}")
                  p.write_text(n, encoding="utf-8")
                  print(f"android: {rel} -> net8.0-android, {removed} items nativos quitados")

              # En .NET Android, OSPlatform.Linux tambien es true: el dlopen de "libdl.so.2" (solo glibc)
              # fallaria al arrancar. Se excluye Android (la carga de libbass en Android la hace el APK).
              wg = W / "WobbleGame.cs"
              t = wg.read_text(encoding="utf-8-sig")
              old = "if (RuntimeInformation.IsOSPlatform(OSPlatform.Linux))"
              if t.count(old) != 1: sys.exit(f"PATCH FALLIDO (--android): se esperaba 1 ocurrencia en WobbleGame.cs y hay {t.count(old)}")
              wg.write_text(t.replace(old, "if (RuntimeInformation.IsOSPlatform(OSPlatform.Linux) && !OperatingSystem.IsAndroid())"), encoding="utf-8")
              print("android: WobbleGame.cs excluye Android del dlopen(libdl.so.2)")

              # Los binarios nativos de escritorio se BORRAN del checkout (solo en esta sonda): ni 'None Update' ni
              # 'None Remove' lograron evitar XA4301 en CI (rondas 3-4). Quaver.Server.Client.dll es gestionada: se conserva.
              import shutil
              x64 = root / "Wobble" / "Wobble" / "x64"
              if not x64.is_dir(): sys.exit("PATCH FALLIDO (--android): no existe Wobble/Wobble/x64")
              shutil.rmtree(x64); print("android: borrado", x64.relative_to(root))
              for base, pat in ((root / "Wobble" / "Wobble", "*.dylib"), (root / "Quaver.Shared", "libsteam_api.*"),
                                (root / "Quaver.Shared", "steam_api*.dll")):
                  for fl in sorted(base.glob(pat)):
                      fl.unlink(); print("android: borrado", fl.relative_to(root))

              # 24 avisos XA0101: contentFiles de MonoGame.Extended 3.8.0 (mgfxc, SharpDX...) no valen en Android.
              wc = root / "Wobble" / "Wobble" / "Wobble.csproj"
              t = wc.read_text(encoding="utf-8-sig")
              old = '<PackageReference Include="MonoGame.Extended" Version="3.8.0" />'
              if t.count(old) != 1: sys.exit("PATCH FALLIDO (--android): MonoGame.Extended 3.8.0 no encontrado")
              wc.write_text(t.replace(old, '<PackageReference Include="MonoGame.Extended" Version="3.8.0" ExcludeAssets="contentFiles" />'), encoding="utf-8")
              print("android: MonoGame.Extended sin contentFiles")

              # 8) GameWindow.TextInput solo existe en MonoGame con #if WINDOWS/DESKTOPGL/ANGLE (verificado en el
              #    codigo de GameWindow.cs); en Android da CS1061 (CI ronda 6: 4 usos). Evento estatico PROVISIONAL:
              #    NO se dispara todavia, asi que no habra entrada de texto hasta conectar el teclado de Android.
              (W / "Platform" / "TextInputCompat.cs").write_text('''using System;
          using Microsoft.Xna.Framework;
          using Microsoft.Xna.Framework.Input;

          namespace Wobble.Platform
          {
              // PROVISIONAL (solo Android): sustituye GameWindow.TextInput. Sin origen de eventos todavia;
              // la actividad de Android debera llamar a Raise(...) desde el teclado en pantalla.
              public static class TextInputCompat
              {
                  public static event EventHandler<TextInputEventArgs> TextInput;

                  public static void Raise(char character, Keys key = Keys.None) =>
                      TextInput?.Invoke(null, new TextInputEventArgs(character, key));
              }
          }
          ''', encoding="utf-8")
              print("android: creado Wobble/Wobble/Platform/TextInputCompat.cs")
              ti = re.compile(r"(?<![\w.])(?:(?:GameBase\.)?Game\.)?Window\.TextInput")
              total = 0
              for base in (root / "Wobble", root / "Quaver.Shared"):
                  for fl in base.rglob("*.cs"):
                      if fl.name == "TextInputCompat.cs": continue
                      t = fl.read_text(encoding="utf-8-sig")
                      n, c = ti.subn("global::Wobble.Platform.TextInputCompat.TextInput", t)
                      if c: fl.write_text(n, encoding="utf-8"); total += c; print("android: TextInput ->", fl.relative_to(root), c)
              if total != 4: print(f"AVISO PATCH (--android): se esperaban 4 usos de Window.TextInput y hay {total}; se continua para obtener el log")

              # 9) RIESGO EN EJECUCION (leido en TextInputManager.cs, no es error de compilacion): en Android la ventana no es
              #    "SdlGameWindow", asi que Lazy<SdlTextInput> vale null; pero IsValueCreated pasa a true tras StartTextInput y
              #    luego 'Sdl.Value.X' lanzaria NullReferenceException al enfocar un Textbox. Se protege con comprobaciones de null.
              tm = W / "Platform" / "TextInputManager.cs"
              t = tm.read_text(encoding="utf-8-sig")
              g1 = "Sdl.IsValueCreated && Sdl.Value."
              g2 = "Sdl.Value.AcknowledgeTextInput();"
              if t.count(g1) != 2 or t.count(g2) != 1:
                  print(f"AVISO PATCH (--android): TextInputManager.cs distinto de lo esperado (g1={t.count(g1)}, g2={t.count(g2)}); se omite el endurecimiento de ejecucion")
              else:
                  t = t.replace(g1, "Sdl.IsValueCreated && Sdl.Value != null && Sdl.Value.").replace(g2, "Sdl.Value?.AcknowledgeTextInput();")
                  tm.write_text(t, encoding="utf-8")
                  print("android: TextInputManager protegido contra Sdl.Value == null")

              # 10) WobbleGame.WorkingDirectory es AppDomain.BaseDirectory (solo lectura). En Android esa ruta no es un
              #     directorio de datos escribible: la actividad debe poder asignar FilesDir antes de iniciar el juego.
              wgc = W / "WobbleGame.cs"
              t = wgc.read_text(encoding="utf-8-sig")
              wd_old = "public static string WorkingDirectory => AppDomain.CurrentDomain.BaseDirectory;"
              wd_new = "public static string WorkingDirectory { get; set; } = AppDomain.CurrentDomain.BaseDirectory;"
              if t.count(wd_old) != 1:
                  print(f"AVISO PATCH (--android): WorkingDirectory no encontrado ({t.count(wd_old)} coincidencias); la app Android no podra fijar su directorio de datos")
              else:
                  wgc.write_text(t.replace(wd_old, wd_new), encoding="utf-8")
                  print("android: WobbleGame.WorkingDirectory ahora es asignable")

              # 11) RIESGO EN EJECUCION: WobbleGame() llama NativeAssemblies.Copy(), que hace Directory.GetFiles("<base>/x64/");
              #     en Android ese directorio no existe (DirectoryNotFoundException al construir QuaverGame).
              na = W / "Platform" / "NativeAssemblies.cs"
              t = na.read_text(encoding="utf-8-sig")
              old = "foreach (var file in Directory.GetFiles(NativeDirectory))"
              if t.count(old) != 1:
                  print(f"AVISO PATCH (--android): NativeAssemblies.Copy distinto de lo esperado ({t.count(old)})")
              else:
                  na.write_text(t.replace(old, "if (!Directory.Exists(NativeDirectory))\n                return;\n\n            foreach (var file in Directory.GetFiles(NativeDirectory))"), encoding="utf-8")
                  print("android: NativeAssemblies.Copy no falla si no existe el directorio nativo")

              # 12) RIESGO EN EJECUCION: DllResourceStore usa Assembly.LoadFrom(<ruta del ensamblado>\\x.dll). En Android los ensamblados
              #     van dentro del APK (Location vacia): se cargan por nombre.
              dr = W / "IO" / "DllResourceStore.cs"
              t = dr.read_text(encoding="utf-8-sig")
              old = "assembly = Assembly.LoadFrom(Path.Combine(Path.GetDirectoryName(Assembly.GetCallingAssembly().Location), dllName));"
              if t.count(old) != 1:
                  print(f"AVISO PATCH (--android): DllResourceStore distinto de lo esperado ({t.count(old)})")
              else:
                  new = ("assembly = OperatingSystem.IsAndroid()\n"
                         "                ? Assembly.Load(new AssemblyName(Path.GetFileNameWithoutExtension(dllName)))\n"
                         "                : Assembly.LoadFrom(Path.Combine(Path.GetDirectoryName(Assembly.GetCallingAssembly().Location), dllName));")
                  dr.write_text(t.replace(old, new), encoding="utf-8")
                  print("android: DllResourceStore carga ensamblados por nombre")

              # 13) RIESGO EN EJECUCION: Logger escribe en <BaseDirectory>/Logs, que en Android puede no ser escribible.
              lg = W / "Logging" / "Logger.cs"
              t = lg.read_text(encoding="utf-8-sig")
              old = 'Path.Join(AppDomain.CurrentDomain.BaseDirectory, "Logs")'
              if t.count(old) != 1:
                  print(f"AVISO PATCH (--android): Logger.LogsFolder distinto de lo esperado ({t.count(old)})")
              else:
                  lg.write_text(t.replace(old, 'Path.Join(global::Wobble.WobbleGame.WorkingDirectory, "Logs")'), encoding="utf-8")
                  print("android: Logger usa WobbleGame.WorkingDirectory")
          # 14) ROBUSTEZ TEXTURAS: AssetLoader con fallback blanco 1x1 si la textura es nula
          al = W / "Assets" / "AssetLoader.cs"
          t_al = al.read_text(encoding="utf-8-sig")
          n_al, c_al = re.subn(r'(public static Texture2D LoadTexture2D\(byte\[\] data\)\s*\{\s*)(using \(var stream = new MemoryStream\(data\)\))',
                               r'\1if (data == null || data.Length == 0) { var fb = new Texture2D(GameBase.Game.GraphicsDevice, 1, 1); fb.SetData(new[] { Color.White }); return fb; }\n            \2', t_al)
          if c_al != 1: sys.exit(f"PATCH FALLIDO (AssetLoader): se esperaba 1 reemplazo y hay {c_al}")
          al.write_text(n_al, encoding="utf-8")
          print("android: AssetLoader con fallback seguro para texturas nulas")

          # 15) ROBUSTEZ AUDIO: AudioManager tolera fallo de audio sin cerrar la app en Android
          am = W / "Audio" / "AudioManager.cs"
          t_am = am.read_text(encoding="utf-8-sig")
          old_am_init = """            if (!Bass.Init(device.Value))
            {
                var error = Bass.LastError;
                Logger.Error($"BASS has failed to initialize (error code: {(int)error}, name: \"{error}\")", LogType.Runtime);

                throw new AudioEngineException("Quaver could not find an audio output device. Please connect or enable an audio output device and restart the game.");
            }"""
          new_am_init = """            if (!Bass.Init(device.Value))
            {
                var error = Bass.LastError;
                Logger.Error($"BASS has failed to initialize (error code: {(int)error}, name: \"{error}\")", LogType.Runtime);

                if (!OperatingSystem.IsAndroid())
                    throw new AudioEngineException("Quaver could not find an audio output device. Please connect or enable an audio output device and restart the game.");

                Tracks = new List<IAudioTrack>();
                return;
            }"""
          if t_am.count(old_am_init) != 1: sys.exit("PATCH FALLIDO (AudioManager.Init)")
          t_am = t_am.replace(old_am_init, new_am_init)
          old_am_lost = 'throw new AudioEngineException("Quaver lost access to its audio output device and could not find another output device. Please connect or enable an audio output device and restart the game.");'
          if t_am.count(old_am_lost) != 1: sys.exit("PATCH FALLIDO (AudioManager.LostOutput)")
          t_am = t_am.replace(old_am_lost, 'if (OperatingSystem.IsAndroid()) return;\n            ' + old_am_lost)
          am.write_text(t_am, encoding="utf-8")
          print("android: AudioManager tolera fallo de audio sin cerrar en Android")

          # 16) ROBUSTEZ IMPORTADOR: MapsetImporter omite FileSystemWatcher de escritorio en Android
          mi = root / "Quaver.Shared" / "Database" / "Maps" / "MapsetImporter.cs"
          t_mi = mi.read_text(encoding="utf-8-sig")
          n_mi, c_mi = re.subn(r'(internal static void WatchForChanges\(\)\s*\{)', r'\1\n            if (OperatingSystem.IsAndroid()) return;', t_mi)
          if c_mi != 1: sys.exit(f"PATCH FALLIDO (MapsetImporter): se esperaba 1 reemplazo y hay {c_mi}")
          mi.write_text(n_mi, encoding="utf-8")
          print("android: MapsetImporter omite FileSystemWatcher de escritorio en Android")

          # 17) ROBUSTEZ PANTALLA, PRIORIDAD Y DISCORD EN QuaverGame
          qg = root / "Quaver.Shared" / "QuaverGame.cs"
          t_qg = qg.read_text(encoding="utf-8-sig")
          old_qg_res = """        public void ChangeResolution()
        {
            if (!QuaverWindowManager.CanChangeResolutionOnScene)"""
          new_qg_res = """        public void ChangeResolution()
        {
            if (OperatingSystem.IsAndroid()) return;

            if (!QuaverWindowManager.CanChangeResolutionOnScene)"""
          if t_qg.count(old_qg_res) != 1: sys.exit("PATCH FALLIDO (QuaverGame.ChangeResolution)")
          t_qg = t_qg.replace(old_qg_res, new_qg_res)

          old_qg_prio = """        public void SetProcessPriority()
        {
            var priority = ProcessPriorityClass.Normal;"""
          new_qg_prio = """        public void SetProcessPriority()
        {
            if (OperatingSystem.IsAndroid()) return;

            var priority = ProcessPriorityClass.Normal;"""
          if t_qg.count(old_qg_prio) != 1: sys.exit("PATCH FALLIDO (QuaverGame.SetProcessPriority)")
          t_qg = t_qg.replace(old_qg_prio, new_qg_prio)

          old_qg_disc = """            // Handle discord rich presence.
            DiscordHelper.Initialize("376180410490552320");"""
          new_qg_disc = """            // Handle discord rich presence.
            if (!OperatingSystem.IsAndroid())
                DiscordHelper.Initialize("376180410490552320");"""
          if t_qg.count(old_qg_disc) != 1: sys.exit("PATCH FALLIDO (QuaverGame.DiscordHelper)")
          t_qg = t_qg.replace(old_qg_disc, new_qg_disc)
          qg.write_text(t_qg, encoding="utf-8")
          print("android: QuaverGame protegido contra ChangeResolution, Priority y Discord en Android")


          PY
      - name: Paquete MonoGame upstream (version = hipotesis)
        run: dotnet add Wobble/Wobble/Wobble.csproj package MonoGame.Framework.DesktopGL --version 3.8.1.303
      - name: Build (guarda todos los errores)
        run: |
          set +e
          cd Quaver
          dotnet build 2>&1 | tee ../build-upstream-patched.log
          echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" | tee -a ../build-upstream-patched.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-upstream-patched-logs
          path: |
            patch.log
            build-upstream-patched.log

  android-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Fijar SDK .NET 8 (el runner trae tambien el 10)
        run: |
          echo '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' > global.json
          dotnet --version
      - name: Submodulos
        run: git -c submodule."Quaver.Server.Client".update=none submodule update --init --recursive
      - name: Parche PROVISIONAL para MonoGame upstream
        run: |
          python3 - . --android <<'PY' 2>&1 | tee patch.log
          """PROVISIONAL (solo sonda de CI). Adapta Wobble/Quaver para compilar contra MonoGame
          upstream (NuGet) en lugar del fork binario de Quaver. Falla con error claro si algun
          patron no se encuentra (p.ej. si el commit de Wobble cambia)."""
          import re, sys, pathlib

          print("patch_upstream v10")

          root = pathlib.Path(sys.argv[1] if len(sys.argv) > 1 else ".")
          W = root / "Wobble" / "Wobble"

          def rw(path, fn):
              t = path.read_text(encoding="utf-8-sig")
              n = fn(t)
              if n == t:
                  sys.exit(f"PATCH FALLIDO: sin cambios en {path}")
              path.write_text(n, encoding="utf-8")
              print("parcheado:", path.relative_to(root))

          # 1) Quitar la DLL propia de MonoGame de todos los csproj
          ref = re.compile(r'\s*<Reference Include="MonoGame\.Framework">.*?</Reference>', re.S)
          for p in root.rglob("*.csproj"):
              t = p.read_text(encoding="utf-8-sig")
              n = ref.sub("", t)
              if n != t:
                  p.write_text(n, encoding="utf-8"); print("csproj sin DLL propia:", p.relative_to(root))

          # 2) Game(bool preferWayland) no existe en upstream: ctor sin argumentos (parametro ignorado)
          def wobblegame(t):
              t = t.replace(": base(preferWayland)", ": base()")
              # WaylandVsync solo existe en el Game del fork: propiedad sin efecto (PROVISIONAL)
              return re.sub(r"(public abstract class WobbleGame : Game\s*\{)",
                            r"\1\n        public bool WaylandVsync { get; set; } // PROVISIONAL: sin efecto fuera del fork\n", t, count=1)
          rw(W / "WobbleGame.cs", wobblegame)

          # 3) Portapapeles: upstream no tiene Game.Get/SetClipboardText. STUB en memoria (PROVISIONAL).
          rw(W / "Platform" / "Linux" / "SdlClipboard.cs", lambda t: re.sub(
              r"public override string GetText\(\).*?;\s*public override void SetText\(string selectedText\).*?;",
              "private static string _text = \"\"; // PROVISIONAL: portapapeles solo en memoria\n"
              "        public override string GetText() => _text;\n\n"
              "        public override void SetText(string selectedText) => _text = selectedText ?? \"\";",
              t, flags=re.S))

          # 4) Teclas solo del fork (AZERTY): se eliminan sus nombres de visualizacion
          bad = "Asterisk|Squared|OemColon|OemCloseParenthesis|OemExclamationMark|Caret|DollarSign|PunctuatedU"
          case = re.compile(r'\s*case Keys\.(?:%s):\s*(?:keyStr = "[^"]*";\s*)?return [^;]*;' % bad)
          def keys(t):
              n, c = case.subn("", t)
              if c != 8: sys.exit(f"PATCH FALLIDO: se esperaban 8 'case' y hay {c}")
              return n
          rw(W / "Helpers" / "XnaKeyHelper.cs", keys)

          # 5) SpriteBatch.Draw con destino RectangleF (sobrecarga del fork) -> extension equivalente
          ext = W / "Graphics" / "SpriteBatchRectangleFExtensions.cs"
          ext.write_text('''using Microsoft.Xna.Framework;
          using Microsoft.Xna.Framework.Graphics;
          using MonoGame.Extended;

          namespace Wobble.Graphics
          {
              // PROVISIONAL: sustituye la sobrecarga Draw(..., RectangleF, ...) del fork de MonoGame.
              // Equivalente a Draw con rectangulo destino: posicion = (X,Y), escala = destino/origen,
              // 'origin' en pixeles de textura.
              public static class SpriteBatchRectangleFExtensions
              {
                  public static void Draw(this SpriteBatch sb, Texture2D texture, RectangleF destination,
                      Rectangle? source, Color color, float rotation, Vector2 origin, SpriteEffects effects, float layerDepth)
                  {
                      var sw = source?.Width ?? texture.Width;
                      var sh = source?.Height ?? texture.Height;
                      var scale = new Vector2(sw == 0 ? 0 : destination.Width / sw, sh == 0 ? 0 : destination.Height / sh);
                      sb.Draw(texture, new Vector2(destination.X, destination.Y), source, color, rotation, origin, scale, effects, layerDepth);
                  }
              }
          }
          ''', encoding="utf-8")
          print("creado:", ext.relative_to(root))

          # 6) GameWindow.FileDropped solo existe en el fork de MonoGame.
          #    Se redirige a un evento estatico que NUNCA se dispara (PROVISIONAL: sin arrastrar y soltar).
          (W / "Platform" / "FileDropCompat.cs").write_text('''using System;

          namespace Wobble.Platform
          {
              // PROVISIONAL: sustituye GameWindow.FileDropped del fork. No se dispara nunca.
              public static class FileDropCompat
              {
                  public static event EventHandler<string> FileDropped { add { } remove { } }
              }
          }
          ''', encoding="utf-8")
          print("creado: Wobble/Wobble/Platform/FileDropCompat.cs")
          drop = re.compile(r"(?:GameBase\.Game\.)?\bWindow\.FileDropped")
          total = 0
          for f in (root / "Quaver.Shared").rglob("*.cs"):
              t = f.read_text(encoding="utf-8-sig")
              n, c = drop.subn("Wobble.Platform.FileDropCompat.FileDropped", t)
              if c:
                  f.write_text(n, encoding="utf-8"); total += c
          if total != 13: sys.exit(f"PATCH FALLIDO: se esperaban 13 usos de FileDropped y hay {total}")
          print("FileDropped redirigido en", total, "sitios")

          # 7) Modo --android (SONDA): Wobble, Wobble.Extended y Quaver.Shared como net8.0-android y
          #    sin los binarios nativos de escritorio (.so/.dll/.dylib/x64/*), que rompen el empaquetado
          #    de Android (XA4301). NO anade soporte real de audio/Steam: es solo para ver errores de C#.
          if "--android" in sys.argv:
              nat = re.compile(r'\s*<None Update="(?:[^"]*\.(?:so|dll|dylib)|x64/\*)">.*?</None>', re.S)
              for rel in ("Wobble/Wobble/Wobble.csproj", "Wobble/Wobble.Extended/Wobble.Extended.csproj",
                          "Quaver.Shared/Quaver.Shared.csproj"):
                  p = root / rel
                  t = p.read_text(encoding="utf-8-sig")
                  n = t.replace("<TargetFramework>net8.0</TargetFramework>", "<TargetFramework>net8.0-android</TargetFramework>")
                  n, removed = nat.subn("", n)
                  # 'None Update' no saca los archivos del glob por defecto; el SDK de Android sigue viendo
                  # los *.so como bibliotecas nativas sin ABI (XA4301). Se eliminan del glob (CI ronda 4).
                  n = n.replace("</Project>", """  <ItemGroup>
              <None Remove="x64/**" />
              <None Remove="**/*.so" />
              <None Remove="**/*.dylib" />
              <None Remove="**/*.dll" />
            </ItemGroup>
          </Project>""")
                  if n == t: sys.exit(f"PATCH FALLIDO (--android): sin cambios en {rel}")
                  p.write_text(n, encoding="utf-8")
                  print(f"android: {rel} -> net8.0-android, {removed} items nativos quitados")

              # En .NET Android, OSPlatform.Linux tambien es true: el dlopen de "libdl.so.2" (solo glibc)
              # fallaria al arrancar. Se excluye Android (la carga de libbass en Android la hace el APK).
              wg = W / "WobbleGame.cs"
              t = wg.read_text(encoding="utf-8-sig")
              old = "if (RuntimeInformation.IsOSPlatform(OSPlatform.Linux))"
              if t.count(old) != 1: sys.exit(f"PATCH FALLIDO (--android): se esperaba 1 ocurrencia en WobbleGame.cs y hay {t.count(old)}")
              wg.write_text(t.replace(old, "if (RuntimeInformation.IsOSPlatform(OSPlatform.Linux) && !OperatingSystem.IsAndroid())"), encoding="utf-8")
              print("android: WobbleGame.cs excluye Android del dlopen(libdl.so.2)")

              # Los binarios nativos de escritorio se BORRAN del checkout (solo en esta sonda): ni 'None Update' ni
              # 'None Remove' lograron evitar XA4301 en CI (rondas 3-4). Quaver.Server.Client.dll es gestionada: se conserva.
              import shutil
              x64 = root / "Wobble" / "Wobble" / "x64"
              if not x64.is_dir(): sys.exit("PATCH FALLIDO (--android): no existe Wobble/Wobble/x64")
              shutil.rmtree(x64); print("android: borrado", x64.relative_to(root))
              for base, pat in ((root / "Wobble" / "Wobble", "*.dylib"), (root / "Quaver.Shared", "libsteam_api.*"),
                                (root / "Quaver.Shared", "steam_api*.dll")):
                  for fl in sorted(base.glob(pat)):
                      fl.unlink(); print("android: borrado", fl.relative_to(root))

              # 24 avisos XA0101: contentFiles de MonoGame.Extended 3.8.0 (mgfxc, SharpDX...) no valen en Android.
              wc = root / "Wobble" / "Wobble" / "Wobble.csproj"
              t = wc.read_text(encoding="utf-8-sig")
              old = '<PackageReference Include="MonoGame.Extended" Version="3.8.0" />'
              if t.count(old) != 1: sys.exit("PATCH FALLIDO (--android): MonoGame.Extended 3.8.0 no encontrado")
              wc.write_text(t.replace(old, '<PackageReference Include="MonoGame.Extended" Version="3.8.0" ExcludeAssets="contentFiles" />'), encoding="utf-8")
              print("android: MonoGame.Extended sin contentFiles")

              # 8) GameWindow.TextInput solo existe en MonoGame con #if WINDOWS/DESKTOPGL/ANGLE (verificado en el
              #    codigo de GameWindow.cs); en Android da CS1061 (CI ronda 6: 4 usos). Evento estatico PROVISIONAL:
              #    NO se dispara todavia, asi que no habra entrada de texto hasta conectar el teclado de Android.
              (W / "Platform" / "TextInputCompat.cs").write_text('''using System;
          using Microsoft.Xna.Framework;
          using Microsoft.Xna.Framework.Input;

          namespace Wobble.Platform
          {
              // PROVISIONAL (solo Android): sustituye GameWindow.TextInput. Sin origen de eventos todavia;
              // la actividad de Android debera llamar a Raise(...) desde el teclado en pantalla.
              public static class TextInputCompat
              {
                  public static event EventHandler<TextInputEventArgs> TextInput;

                  public static void Raise(char character, Keys key = Keys.None) =>
                      TextInput?.Invoke(null, new TextInputEventArgs(character, key));
              }
          }
          ''', encoding="utf-8")
              print("android: creado Wobble/Wobble/Platform/TextInputCompat.cs")
              ti = re.compile(r"(?<![\w.])(?:(?:GameBase\.)?Game\.)?Window\.TextInput")
              total = 0
              for base in (root / "Wobble", root / "Quaver.Shared"):
                  for fl in base.rglob("*.cs"):
                      if fl.name == "TextInputCompat.cs": continue
                      t = fl.read_text(encoding="utf-8-sig")
                      n, c = ti.subn("global::Wobble.Platform.TextInputCompat.TextInput", t)
                      if c: fl.write_text(n, encoding="utf-8"); total += c; print("android: TextInput ->", fl.relative_to(root), c)
              if total != 4: print(f"AVISO PATCH (--android): se esperaban 4 usos de Window.TextInput y hay {total}; se continua para obtener el log")

              # 9) RIESGO EN EJECUCION (leido en TextInputManager.cs, no es error de compilacion): en Android la ventana no es
              #    "SdlGameWindow", asi que Lazy<SdlTextInput> vale null; pero IsValueCreated pasa a true tras StartTextInput y
              #    luego 'Sdl.Value.X' lanzaria NullReferenceException al enfocar un Textbox. Se protege con comprobaciones de null.
              tm = W / "Platform" / "TextInputManager.cs"
              t = tm.read_text(encoding="utf-8-sig")
              g1 = "Sdl.IsValueCreated && Sdl.Value."
              g2 = "Sdl.Value.AcknowledgeTextInput();"
              if t.count(g1) != 2 or t.count(g2) != 1:
                  print(f"AVISO PATCH (--android): TextInputManager.cs distinto de lo esperado (g1={t.count(g1)}, g2={t.count(g2)}); se omite el endurecimiento de ejecucion")
              else:
                  t = t.replace(g1, "Sdl.IsValueCreated && Sdl.Value != null && Sdl.Value.").replace(g2, "Sdl.Value?.AcknowledgeTextInput();")
                  tm.write_text(t, encoding="utf-8")
                  print("android: TextInputManager protegido contra Sdl.Value == null")

              # 10) WobbleGame.WorkingDirectory es AppDomain.BaseDirectory (solo lectura). En Android esa ruta no es un
              #     directorio de datos escribible: la actividad debe poder asignar FilesDir antes de iniciar el juego.
              wgc = W / "WobbleGame.cs"
              t = wgc.read_text(encoding="utf-8-sig")
              wd_old = "public static string WorkingDirectory => AppDomain.CurrentDomain.BaseDirectory;"
              wd_new = "public static string WorkingDirectory { get; set; } = AppDomain.CurrentDomain.BaseDirectory;"
              if t.count(wd_old) != 1:
                  print(f"AVISO PATCH (--android): WorkingDirectory no encontrado ({t.count(wd_old)} coincidencias); la app Android no podra fijar su directorio de datos")
              else:
                  wgc.write_text(t.replace(wd_old, wd_new), encoding="utf-8")
                  print("android: WobbleGame.WorkingDirectory ahora es asignable")

              # 11) RIESGO EN EJECUCION: WobbleGame() llama NativeAssemblies.Copy(), que hace Directory.GetFiles("<base>/x64/");
              #     en Android ese directorio no existe (DirectoryNotFoundException al construir QuaverGame).
              na = W / "Platform" / "NativeAssemblies.cs"
              t = na.read_text(encoding="utf-8-sig")
              old = "foreach (var file in Directory.GetFiles(NativeDirectory))"
              if t.count(old) != 1:
                  print(f"AVISO PATCH (--android): NativeAssemblies.Copy distinto de lo esperado ({t.count(old)})")
              else:
                  na.write_text(t.replace(old, "if (!Directory.Exists(NativeDirectory))\n                return;\n\n            foreach (var file in Directory.GetFiles(NativeDirectory))"), encoding="utf-8")
                  print("android: NativeAssemblies.Copy no falla si no existe el directorio nativo")

              # 12) RIESGO EN EJECUCION: DllResourceStore usa Assembly.LoadFrom(<ruta del ensamblado>\\x.dll). En Android los ensamblados
              #     van dentro del APK (Location vacia): se cargan por nombre.
              dr = W / "IO" / "DllResourceStore.cs"
              t = dr.read_text(encoding="utf-8-sig")
              old = "assembly = Assembly.LoadFrom(Path.Combine(Path.GetDirectoryName(Assembly.GetCallingAssembly().Location), dllName));"
              if t.count(old) != 1:
                  print(f"AVISO PATCH (--android): DllResourceStore distinto de lo esperado ({t.count(old)})")
              else:
                  new = ("assembly = OperatingSystem.IsAndroid()\n"
                         "                ? Assembly.Load(new AssemblyName(Path.GetFileNameWithoutExtension(dllName)))\n"
                         "                : Assembly.LoadFrom(Path.Combine(Path.GetDirectoryName(Assembly.GetCallingAssembly().Location), dllName));")
                  dr.write_text(t.replace(old, new), encoding="utf-8")
                  print("android: DllResourceStore carga ensamblados por nombre")

              # 13) RIESGO EN EJECUCION: Logger escribe en <BaseDirectory>/Logs, que en Android puede no ser escribible.
              lg = W / "Logging" / "Logger.cs"
              t = lg.read_text(encoding="utf-8-sig")
              old = 'Path.Join(AppDomain.CurrentDomain.BaseDirectory, "Logs")'
              if t.count(old) != 1:
                  print(f"AVISO PATCH (--android): Logger.LogsFolder distinto de lo esperado ({t.count(old)})")
              else:
                  lg.write_text(t.replace(old, 'Path.Join(global::Wobble.WobbleGame.WorkingDirectory, "Logs")'), encoding="utf-8")
                  print("android: Logger usa WobbleGame.WorkingDirectory")
          # 14) ROBUSTEZ TEXTURAS: AssetLoader con fallback blanco 1x1 si la textura es nula
          al = W / "Assets" / "AssetLoader.cs"
          t_al = al.read_text(encoding="utf-8-sig")
          n_al, c_al = re.subn(r'(public static Texture2D LoadTexture2D\(byte\[\] data\)\s*\{\s*)(using \(var stream = new MemoryStream\(data\)\))',
                               r'\1if (data == null || data.Length == 0) { var fb = new Texture2D(GameBase.Game.GraphicsDevice, 1, 1); fb.SetData(new[] { Color.White }); return fb; }\n            \2', t_al)
          if c_al != 1: sys.exit(f"PATCH FALLIDO (AssetLoader): se esperaba 1 reemplazo y hay {c_al}")
          al.write_text(n_al, encoding="utf-8")
          print("android: AssetLoader con fallback seguro para texturas nulas")

          # 15) ROBUSTEZ AUDIO: AudioManager tolera fallo de audio sin cerrar la app en Android
          am = W / "Audio" / "AudioManager.cs"
          t_am = am.read_text(encoding="utf-8-sig")
          old_am_init = """            if (!Bass.Init(device.Value))
            {
                var error = Bass.LastError;
                Logger.Error($"BASS has failed to initialize (error code: {(int)error}, name: \"{error}\")", LogType.Runtime);

                throw new AudioEngineException("Quaver could not find an audio output device. Please connect or enable an audio output device and restart the game.");
            }"""
          new_am_init = """            if (!Bass.Init(device.Value))
            {
                var error = Bass.LastError;
                Logger.Error($"BASS has failed to initialize (error code: {(int)error}, name: \"{error}\")", LogType.Runtime);

                if (!OperatingSystem.IsAndroid())
                    throw new AudioEngineException("Quaver could not find an audio output device. Please connect or enable an audio output device and restart the game.");

                Tracks = new List<IAudioTrack>();
                return;
            }"""
          if t_am.count(old_am_init) != 1: sys.exit("PATCH FALLIDO (AudioManager.Init)")
          t_am = t_am.replace(old_am_init, new_am_init)
          old_am_lost = 'throw new AudioEngineException("Quaver lost access to its audio output device and could not find another output device. Please connect or enable an audio output device and restart the game.");'
          if t_am.count(old_am_lost) != 1: sys.exit("PATCH FALLIDO (AudioManager.LostOutput)")
          t_am = t_am.replace(old_am_lost, 'if (OperatingSystem.IsAndroid()) return;\n            ' + old_am_lost)
          am.write_text(t_am, encoding="utf-8")
          print("android: AudioManager tolera fallo de audio sin cerrar en Android")

          # 16) ROBUSTEZ IMPORTADOR: MapsetImporter omite FileSystemWatcher de escritorio en Android
          mi = root / "Quaver.Shared" / "Database" / "Maps" / "MapsetImporter.cs"
          t_mi = mi.read_text(encoding="utf-8-sig")
          n_mi, c_mi = re.subn(r'(internal static void WatchForChanges\(\)\s*\{)', r'\1\n            if (OperatingSystem.IsAndroid()) return;', t_mi)
          if c_mi != 1: sys.exit(f"PATCH FALLIDO (MapsetImporter): se esperaba 1 reemplazo y hay {c_mi}")
          mi.write_text(n_mi, encoding="utf-8")
          print("android: MapsetImporter omite FileSystemWatcher de escritorio en Android")

          # 17) ROBUSTEZ PANTALLA, PRIORIDAD Y DISCORD EN QuaverGame
          qg = root / "Quaver.Shared" / "QuaverGame.cs"
          t_qg = qg.read_text(encoding="utf-8-sig")
          old_qg_res = """        public void ChangeResolution()
        {
            if (!QuaverWindowManager.CanChangeResolutionOnScene)"""
          new_qg_res = """        public void ChangeResolution()
        {
            if (OperatingSystem.IsAndroid()) return;

            if (!QuaverWindowManager.CanChangeResolutionOnScene)"""
          if t_qg.count(old_qg_res) != 1: sys.exit("PATCH FALLIDO (QuaverGame.ChangeResolution)")
          t_qg = t_qg.replace(old_qg_res, new_qg_res)

          old_qg_prio = """        public void SetProcessPriority()
        {
            var priority = ProcessPriorityClass.Normal;"""
          new_qg_prio = """        public void SetProcessPriority()
        {
            if (OperatingSystem.IsAndroid()) return;

            var priority = ProcessPriorityClass.Normal;"""
          if t_qg.count(old_qg_prio) != 1: sys.exit("PATCH FALLIDO (QuaverGame.SetProcessPriority)")
          t_qg = t_qg.replace(old_qg_prio, new_qg_prio)

          old_qg_disc = """            // Handle discord rich presence.
            DiscordHelper.Initialize("376180410490552320");"""
          new_qg_disc = """            // Handle discord rich presence.
            if (!OperatingSystem.IsAndroid())
                DiscordHelper.Initialize("376180410490552320");"""
          if t_qg.count(old_qg_disc) != 1: sys.exit("PATCH FALLIDO (QuaverGame.DiscordHelper)")
          t_qg = t_qg.replace(old_qg_disc, new_qg_disc)
          qg.write_text(t_qg, encoding="utf-8")
          print("android: QuaverGame protegido contra ChangeResolution, Priority y Discord en Android")


          PY
      - name: Workload android y paquete MonoGame para Android (version = hipotesis)
        run: |
          set +e
          dotnet workload install android 2>&1 | tee android-workload.log
          dotnet add Wobble/Wobble/Wobble.csproj package MonoGame.Framework.Android --version 3.8.1.303 2>&1 | tee -a android-workload.log
      - name: Evidencia del parche (diagnostico)
        run: |
          set +e
          {
            echo "WORKFLOW_VERSION=v10"
            echo "== Wobble.csproj (final)"; tail -n 14 Wobble/Wobble/Wobble.csproj
            echo "== marca del parche v10 (debe listar archivos)"; grep -rl 'TextInputCompat' Wobble Quaver.Shared --include=*.cs | head -5
            echo "== binarios nativos restantes (fuera de bin/obj)"
            find . -type f -not -path '*/bin/*' -not -path '*/obj/*' | grep -E '[.]so($|[.])|[.]dylib$'
            echo "== items con .so segun MSBuild"
            dotnet msbuild Wobble/Wobble/Wobble.csproj -getItem:None -getItem:Content -getItem:AndroidNativeLibrary 2>&1 | grep -iE '[.]so' | head -20
          } 2>&1 | tee patch-evidence.log
      - name: Build Wobble (net8.0-android)
        run: |
          set +e
          dotnet build Wobble/Wobble/Wobble.csproj -f net8.0-android 2>&1 | tee build-android-wobble.log
          echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" | tee -a build-android-wobble.log
      - name: Build Quaver.Shared (net8.0-android)
        run: |
          set +e
          dotnet build Quaver.Shared/Quaver.Shared.csproj -f net8.0-android 2>&1 | tee build-android-shared.log
          echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" | tee -a build-android-shared.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-android-logs
          path: |
            android-workload.log
            patch.log
            patch-evidence.log
            build-android-wobble.log
            build-android-shared.log

  # Hito 2 (humo): app Android MINIMA con MonoGame (4 columnas multitouch). NO es el juego Quaver.
  #  A = solo MonoGame.  B = ademas referencia Quaver.API y parsea un mapa de prueba al arrancar.
  android-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Fijar SDK .NET 8
        run: |
          echo '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' > global.json
          dotnet --version
      - name: Submodulos
        run: git -c submodule."Quaver.Server.Client".update=none submodule update --init --recursive
      - name: Workload android
        run: dotnet workload install android 2>&1 | tail -n 5
      - name: Crear app de humo (PROVISIONAL)
        run: |
          mkdir -p android-smoke/Assets android-smoke/Resources/drawable android-smoke/Resources/mipmap-xxxhdpi
          cp Quaver.Resources/Quaver.Resources/Icons/quaver-logo.png android-smoke/Resources/drawable/icon.png
          cp Quaver.Resources/Quaver.Resources/Icons/quaver-logo.png android-smoke/Resources/mipmap-xxxhdpi/icon.png
          cp Quaver.Resources/Quaver.Resources/Maps/Offset/offset.qua android-smoke/Assets/test.qua
          cat > android-smoke/QuaverAndroidSmoke.csproj <<'XMLEOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0-android</TargetFramework>
              <OutputType>Exe</OutputType>
              <RootNamespace>QuaverAndroidSmoke</RootNamespace>
              <AssemblyName>QuaverAndroidSmoke</AssemblyName>
              <SupportedOSPlatformVersion>24</SupportedOSPlatformVersion>
              <ApplicationId>org.communityport.quaverandroid.smoke</ApplicationId>
              <ApplicationVersion>1</ApplicationVersion>
              <ApplicationDisplayVersion>0.0.1-smoke</ApplicationDisplayVersion>
              <RuntimeIdentifier>android-arm64</RuntimeIdentifier>
              <AndroidPackageFormat>apk</AndroidPackageFormat>
              <EmbedAssembliesIntoApk>true</EmbedAssembliesIntoApk>
              <Nullable>disable</Nullable>
              <ImplicitUsings>disable</ImplicitUsings>
              <LangVersion>latest</LangVersion>
            </PropertyGroup>
            <PropertyGroup Condition="'$(WithApi)' == 'true'">
              <DefineConstants>$(DefineConstants);WITH_API</DefineConstants>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="MonoGame.Framework.Android" Version="3.8.1.303" />
            </ItemGroup>
            <ItemGroup Condition="'$(WithApi)' == 'true'">
              <ProjectReference Include="../Quaver.API/Quaver.API/Quaver.API.csproj" />
            </ItemGroup>
          </Project>
          XMLEOF
          cat > android-smoke/AndroidManifest.xml <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="org.communityport.quaverandroid.smoke">
            <application android:label="Quaver Android (prueba)" android:allowBackup="false"></application>
          </manifest>
          XMLEOF
          cat > android-smoke/MainActivity.cs <<'CSEOF'
          using System;
          using System.IO;
          using Android.App;
          using Android.Content.PM;
          using Android.OS;
          using Android.Views;
          using Android.Widget;
          using Microsoft.Xna.Framework;

          namespace QuaverAndroidSmoke
          {
              // PRUEBA DE HUMO (no es Quaver): actividad de MonoGame que muestra 4 columnas tactiles.
              [Activity(Label = "Quaver Android (prueba)", MainLauncher = true, LaunchMode = LaunchMode.SingleInstance,
                  ScreenOrientation = ScreenOrientation.SensorLandscape,
                  ConfigurationChanges = ConfigChanges.Orientation | ConfigChanges.Keyboard | ConfigChanges.KeyboardHidden | ConfigChanges.ScreenSize)]
              public class MainActivity : AndroidGameActivity
              {
                  private SmokeGame _game;

                  protected override void OnCreate(Bundle bundle)
                  {
                      base.OnCreate(bundle);
                      _game = new SmokeGame();
                      SetContentView((View)_game.Services.GetService(typeof(View)));
                      _game.Run();
                      ShowApiCheck();
                  }

                  private void ShowApiCheck()
                  {
          #if WITH_API
                      try
                      {
                          byte[] bytes;
                          using (var s = Assets.Open("test.qua"))
                          using (var ms = new MemoryStream())
                          {
                              s.CopyTo(ms);
                              bytes = ms.ToArray();
                          }

                          var qua = Quaver.API.Maps.Qua.Parse(bytes, false);
                          Toast.MakeText(this, "Quaver.API OK: " + qua.Title + " | " + qua.Mode + " | " + qua.HitObjects.Count + " notas", ToastLength.Long).Show();
                      }
                      catch (Exception e)
                      {
                          Toast.MakeText(this, "Quaver.API FALLO: " + e.GetType().Name + ": " + e.Message, ToastLength.Long).Show();
                      }
          #else
                      Toast.MakeText(this, "Prueba sin Quaver.API: toca con varios dedos", ToastLength.Long).Show();
          #endif
                  }
              }
          }
          CSEOF
          cat > android-smoke/SmokeGame.cs <<'CSEOF'
          using System;
          using Microsoft.Xna.Framework;
          using Microsoft.Xna.Framework.Graphics;
          using Microsoft.Xna.Framework.Input;
          using Microsoft.Xna.Framework.Input.Touch;

          namespace QuaverAndroidSmoke
          {
              // PRUEBA DE HUMO: 4 columnas que se iluminan con multitouch. No procesa notas ni audio.
              public class SmokeGame : Game
              {
                  private readonly GraphicsDeviceManager _graphics;
                  private SpriteBatch _batch;
                  private Texture2D _pixel;
                  private readonly bool[] _down = new bool[4];

                  public SmokeGame()
                  {
                      _graphics = new GraphicsDeviceManager(this)
                      {
                          IsFullScreen = true,
                          SupportedOrientations = DisplayOrientation.LandscapeLeft | DisplayOrientation.LandscapeRight
                      };
                  }

                  protected override void LoadContent()
                  {
                      _batch = new SpriteBatch(GraphicsDevice);
                      _pixel = new Texture2D(GraphicsDevice, 1, 1);
                      _pixel.SetData(new[] { Color.White });
                  }

                  protected override void Update(GameTime gameTime)
                  {
                      if (GamePad.GetState(PlayerIndex.One).Buttons.Back == ButtonState.Pressed)
                          Exit();

                      Array.Clear(_down, 0, _down.Length);
                      var width = GraphicsDevice.Viewport.Width;

                      foreach (var touch in TouchPanel.GetState())
                      {
                          if (touch.State == TouchLocationState.Released || touch.State == TouchLocationState.Invalid)
                              continue;

                          var lane = (int)(touch.Position.X / (width / 4f));
                          if (lane < 0) lane = 0;
                          if (lane > 3) lane = 3;
                          _down[lane] = true;
                      }

                      base.Update(gameTime);
                  }

                  protected override void Draw(GameTime gameTime)
                  {
                      GraphicsDevice.Clear(Color.Black);
                      var vp = GraphicsDevice.Viewport;
                      var laneWidth = vp.Width / 4;

                      _batch.Begin();
                      for (var i = 0; i < 4; i++)
                      {
                          var color = _down[i] ? new Color(80, 160, 255) : new Color(28, 28, 36);
                          _batch.Draw(_pixel, new Rectangle(i * laneWidth + 2, 0, laneWidth - 4, vp.Height), color);
                      }

                      _batch.Draw(_pixel, new Rectangle(0, (int)(vp.Height * 0.85f), vp.Width, 4), Color.White);
                      _batch.End();

                      base.Draw(gameTime);
                  }
              }
          }
          CSEOF
      - name: Dependencias del SDK de Android
        run: |
          set +e
          dotnet build android-smoke/QuaverAndroidSmoke.csproj -t:InstallAndroidDependencies -f net8.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True 2>&1 | tee smoke-deps.log
      - name: Build A (solo MonoGame)
        run: |
          set +e
          mkdir -p smoke-out
          dotnet build android-smoke/QuaverAndroidSmoke.csproj -c Debug 2>&1 | tee smoke-a.log
          echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" | tee -a smoke-a.log
          APK=$(find android-smoke/bin -name '*-Signed.apk' | head -n1); [ -z "$APK" ] && APK=$(find android-smoke/bin -name '*.apk' | head -n1)
          echo "APK elegido: $APK" | tee -a smoke-a.log
          [ -n "$APK" ] && cp "$APK" smoke-out/A-sin-api.apk
          ls -la smoke-out | tee -a smoke-a.log
      - name: Build B (con Quaver.API)
        run: |
          set +e
          rm -rf android-smoke/bin android-smoke/obj
          dotnet build android-smoke/QuaverAndroidSmoke.csproj -c Debug -p:WithApi=true 2>&1 | tee smoke-b.log
          echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" | tee -a smoke-b.log
          APK=$(find android-smoke/bin -name '*-Signed.apk' | head -n1); [ -z "$APK" ] && APK=$(find android-smoke/bin -name '*.apk' | head -n1)
          echo "APK elegido: $APK" | tee -a smoke-b.log
          [ -n "$APK" ] && cp "$APK" smoke-out/B-con-api.apk
          ls -la smoke-out | tee -a smoke-b.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-smoke
          path: |
            smoke-deps.log
            smoke-a.log
            smoke-b.log
            smoke-out/*.apk

  # Hito 2 (real): cabecera Android del juego Quaver (APK Debug arm64). Audio solo si subes android-native-libs.zip.
  android-head:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Fijar SDK .NET 8
        run: |
          echo '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' > global.json
          dotnet --version
      - name: Submodulos
        run: git -c submodule."Quaver.Server.Client".update=none submodule update --init --recursive
      - name: Parche PROVISIONAL para MonoGame upstream
        run: |
          python3 - . --android <<'PY' 2>&1 | tee patch.log
          """PROVISIONAL (solo sonda de CI). Adapta Wobble/Quaver para compilar contra MonoGame
          upstream (NuGet) en lugar del fork binario de Quaver. Falla con error claro si algun
          patron no se encuentra (p.ej. si el commit de Wobble cambia)."""
          import re, sys, pathlib

          print("patch_upstream v10")

          root = pathlib.Path(sys.argv[1] if len(sys.argv) > 1 else ".")
          W = root / "Wobble" / "Wobble"

          def rw(path, fn):
              t = path.read_text(encoding="utf-8-sig")
              n = fn(t)
              if n == t:
                  sys.exit(f"PATCH FALLIDO: sin cambios en {path}")
              path.write_text(n, encoding="utf-8")
              print("parcheado:", path.relative_to(root))

          # 1) Quitar la DLL propia de MonoGame de todos los csproj
          ref = re.compile(r'\s*<Reference Include="MonoGame\.Framework">.*?</Reference>', re.S)
          for p in root.rglob("*.csproj"):
              t = p.read_text(encoding="utf-8-sig")
              n = ref.sub("", t)
              if n != t:
                  p.write_text(n, encoding="utf-8"); print("csproj sin DLL propia:", p.relative_to(root))

          # 2) Game(bool preferWayland) no existe en upstream: ctor sin argumentos (parametro ignorado)
          def wobblegame(t):
              t = t.replace(": base(preferWayland)", ": base()")
              # WaylandVsync solo existe en el Game del fork: propiedad sin efecto (PROVISIONAL)
              return re.sub(r"(public abstract class WobbleGame : Game\s*\{)",
                            r"\1\n        public bool WaylandVsync { get; set; } // PROVISIONAL: sin efecto fuera del fork\n", t, count=1)
          rw(W / "WobbleGame.cs", wobblegame)

          # 3) Portapapeles: upstream no tiene Game.Get/SetClipboardText. STUB en memoria (PROVISIONAL).
          rw(W / "Platform" / "Linux" / "SdlClipboard.cs", lambda t: re.sub(
              r"public override string GetText\(\).*?;\s*public override void SetText\(string selectedText\).*?;",
              "private static string _text = \"\"; // PROVISIONAL: portapapeles solo en memoria\n"
              "        public override string GetText() => _text;\n\n"
              "        public override void SetText(string selectedText) => _text = selectedText ?? \"\";",
              t, flags=re.S))

          # 4) Teclas solo del fork (AZERTY): se eliminan sus nombres de visualizacion
          bad = "Asterisk|Squared|OemColon|OemCloseParenthesis|OemExclamationMark|Caret|DollarSign|PunctuatedU"
          case = re.compile(r'\s*case Keys\.(?:%s):\s*(?:keyStr = "[^"]*";\s*)?return [^;]*;' % bad)
          def keys(t):
              n, c = case.subn("", t)
              if c != 8: sys.exit(f"PATCH FALLIDO: se esperaban 8 'case' y hay {c}")
              return n
          rw(W / "Helpers" / "XnaKeyHelper.cs", keys)

          # 5) SpriteBatch.Draw con destino RectangleF (sobrecarga del fork) -> extension equivalente
          ext = W / "Graphics" / "SpriteBatchRectangleFExtensions.cs"
          ext.write_text('''using Microsoft.Xna.Framework;
          using Microsoft.Xna.Framework.Graphics;
          using MonoGame.Extended;

          namespace Wobble.Graphics
          {
              // PROVISIONAL: sustituye la sobrecarga Draw(..., RectangleF, ...) del fork de MonoGame.
              // Equivalente a Draw con rectangulo destino: posicion = (X,Y), escala = destino/origen,
              // 'origin' en pixeles de textura.
              public static class SpriteBatchRectangleFExtensions
              {
                  public static void Draw(this SpriteBatch sb, Texture2D texture, RectangleF destination,
                      Rectangle? source, Color color, float rotation, Vector2 origin, SpriteEffects effects, float layerDepth)
                  {
                      var sw = source?.Width ?? texture.Width;
                      var sh = source?.Height ?? texture.Height;
                      var scale = new Vector2(sw == 0 ? 0 : destination.Width / sw, sh == 0 ? 0 : destination.Height / sh);
                      sb.Draw(texture, new Vector2(destination.X, destination.Y), source, color, rotation, origin, scale, effects, layerDepth);
                  }
              }
          }
          ''', encoding="utf-8")
          print("creado:", ext.relative_to(root))

          # 6) GameWindow.FileDropped solo existe en el fork de MonoGame.
          #    Se redirige a un evento estatico que NUNCA se dispara (PROVISIONAL: sin arrastrar y soltar).
          (W / "Platform" / "FileDropCompat.cs").write_text('''using System;

          namespace Wobble.Platform
          {
              // PROVISIONAL: sustituye GameWindow.FileDropped del fork. No se dispara nunca.
              public static class FileDropCompat
              {
                  public static event EventHandler<string> FileDropped { add { } remove { } }
              }
          }
          ''', encoding="utf-8")
          print("creado: Wobble/Wobble/Platform/FileDropCompat.cs")
          drop = re.compile(r"(?:GameBase\.Game\.)?\bWindow\.FileDropped")
          total = 0
          for f in (root / "Quaver.Shared").rglob("*.cs"):
              t = f.read_text(encoding="utf-8-sig")
              n, c = drop.subn("Wobble.Platform.FileDropCompat.FileDropped", t)
              if c:
                  f.write_text(n, encoding="utf-8"); total += c
          if total != 13: sys.exit(f"PATCH FALLIDO: se esperaban 13 usos de FileDropped y hay {total}")
          print("FileDropped redirigido en", total, "sitios")

          # 7) Modo --android (SONDA): Wobble, Wobble.Extended y Quaver.Shared como net8.0-android y
          #    sin los binarios nativos de escritorio (.so/.dll/.dylib/x64/*), que rompen el empaquetado
          #    de Android (XA4301). NO anade soporte real de audio/Steam: es solo para ver errores de C#.
          if "--android" in sys.argv:
              nat = re.compile(r'\s*<None Update="(?:[^"]*\.(?:so|dll|dylib)|x64/\*)">.*?</None>', re.S)
              for rel in ("Wobble/Wobble/Wobble.csproj", "Wobble/Wobble.Extended/Wobble.Extended.csproj",
                          "Quaver.Shared/Quaver.Shared.csproj"):
                  p = root / rel
                  t = p.read_text(encoding="utf-8-sig")
                  n = t.replace("<TargetFramework>net8.0</TargetFramework>", "<TargetFramework>net8.0-android</TargetFramework>")
                  n, removed = nat.subn("", n)
                  # 'None Update' no saca los archivos del glob por defecto; el SDK de Android sigue viendo
                  # los *.so como bibliotecas nativas sin ABI (XA4301). Se eliminan del glob (CI ronda 4).
                  n = n.replace("</Project>", """  <ItemGroup>
              <None Remove="x64/**" />
              <None Remove="**/*.so" />
              <None Remove="**/*.dylib" />
              <None Remove="**/*.dll" />
            </ItemGroup>
          </Project>""")
                  if n == t: sys.exit(f"PATCH FALLIDO (--android): sin cambios en {rel}")
                  p.write_text(n, encoding="utf-8")
                  print(f"android: {rel} -> net8.0-android, {removed} items nativos quitados")

              # En .NET Android, OSPlatform.Linux tambien es true: el dlopen de "libdl.so.2" (solo glibc)
              # fallaria al arrancar. Se excluye Android (la carga de libbass en Android la hace el APK).
              wg = W / "WobbleGame.cs"
              t = wg.read_text(encoding="utf-8-sig")
              old = "if (RuntimeInformation.IsOSPlatform(OSPlatform.Linux))"
              if t.count(old) != 1: sys.exit(f"PATCH FALLIDO (--android): se esperaba 1 ocurrencia en WobbleGame.cs y hay {t.count(old)}")
              wg.write_text(t.replace(old, "if (RuntimeInformation.IsOSPlatform(OSPlatform.Linux) && !OperatingSystem.IsAndroid())"), encoding="utf-8")
              print("android: WobbleGame.cs excluye Android del dlopen(libdl.so.2)")

              # Los binarios nativos de escritorio se BORRAN del checkout (solo en esta sonda): ni 'None Update' ni
              # 'None Remove' lograron evitar XA4301 en CI (rondas 3-4). Quaver.Server.Client.dll es gestionada: se conserva.
              import shutil
              x64 = root / "Wobble" / "Wobble" / "x64"
              if not x64.is_dir(): sys.exit("PATCH FALLIDO (--android): no existe Wobble/Wobble/x64")
              shutil.rmtree(x64); print("android: borrado", x64.relative_to(root))
              for base, pat in ((root / "Wobble" / "Wobble", "*.dylib"), (root / "Quaver.Shared", "libsteam_api.*"),
                                (root / "Quaver.Shared", "steam_api*.dll")):
                  for fl in sorted(base.glob(pat)):
                      fl.unlink(); print("android: borrado", fl.relative_to(root))

              # 24 avisos XA0101: contentFiles de MonoGame.Extended 3.8.0 (mgfxc, SharpDX...) no valen en Android.
              wc = root / "Wobble" / "Wobble" / "Wobble.csproj"
              t = wc.read_text(encoding="utf-8-sig")
              old = '<PackageReference Include="MonoGame.Extended" Version="3.8.0" />'
              if t.count(old) != 1: sys.exit("PATCH FALLIDO (--android): MonoGame.Extended 3.8.0 no encontrado")
              wc.write_text(t.replace(old, '<PackageReference Include="MonoGame.Extended" Version="3.8.0" ExcludeAssets="contentFiles" />'), encoding="utf-8")
              print("android: MonoGame.Extended sin contentFiles")

              # 8) GameWindow.TextInput solo existe en MonoGame con #if WINDOWS/DESKTOPGL/ANGLE (verificado en el
              #    codigo de GameWindow.cs); en Android da CS1061 (CI ronda 6: 4 usos). Evento estatico PROVISIONAL:
              #    NO se dispara todavia, asi que no habra entrada de texto hasta conectar el teclado de Android.
              (W / "Platform" / "TextInputCompat.cs").write_text('''using System;
          using Microsoft.Xna.Framework;
          using Microsoft.Xna.Framework.Input;

          namespace Wobble.Platform
          {
              // PROVISIONAL (solo Android): sustituye GameWindow.TextInput. Sin origen de eventos todavia;
              // la actividad de Android debera llamar a Raise(...) desde el teclado en pantalla.
              public static class TextInputCompat
              {
                  public static event EventHandler<TextInputEventArgs> TextInput;

                  public static void Raise(char character, Keys key = Keys.None) =>
                      TextInput?.Invoke(null, new TextInputEventArgs(character, key));
              }
          }
          ''', encoding="utf-8")
              print("android: creado Wobble/Wobble/Platform/TextInputCompat.cs")
              ti = re.compile(r"(?<![\w.])(?:(?:GameBase\.)?Game\.)?Window\.TextInput")
              total = 0
              for base in (root / "Wobble", root / "Quaver.Shared"):
                  for fl in base.rglob("*.cs"):
                      if fl.name == "TextInputCompat.cs": continue
                      t = fl.read_text(encoding="utf-8-sig")
                      n, c = ti.subn("global::Wobble.Platform.TextInputCompat.TextInput", t)
                      if c: fl.write_text(n, encoding="utf-8"); total += c; print("android: TextInput ->", fl.relative_to(root), c)
              if total != 4: print(f"AVISO PATCH (--android): se esperaban 4 usos de Window.TextInput y hay {total}; se continua para obtener el log")

              # 9) RIESGO EN EJECUCION (leido en TextInputManager.cs, no es error de compilacion): en Android la ventana no es
              #    "SdlGameWindow", asi que Lazy<SdlTextInput> vale null; pero IsValueCreated pasa a true tras StartTextInput y
              #    luego 'Sdl.Value.X' lanzaria NullReferenceException al enfocar un Textbox. Se protege con comprobaciones de null.
              tm = W / "Platform" / "TextInputManager.cs"
              t = tm.read_text(encoding="utf-8-sig")
              g1 = "Sdl.IsValueCreated && Sdl.Value."
              g2 = "Sdl.Value.AcknowledgeTextInput();"
              if t.count(g1) != 2 or t.count(g2) != 1:
                  print(f"AVISO PATCH (--android): TextInputManager.cs distinto de lo esperado (g1={t.count(g1)}, g2={t.count(g2)}); se omite el endurecimiento de ejecucion")
              else:
                  t = t.replace(g1, "Sdl.IsValueCreated && Sdl.Value != null && Sdl.Value.").replace(g2, "Sdl.Value?.AcknowledgeTextInput();")
                  tm.write_text(t, encoding="utf-8")
                  print("android: TextInputManager protegido contra Sdl.Value == null")

              # 10) WobbleGame.WorkingDirectory es AppDomain.BaseDirectory (solo lectura). En Android esa ruta no es un
              #     directorio de datos escribible: la actividad debe poder asignar FilesDir antes de iniciar el juego.
              wgc = W / "WobbleGame.cs"
              t = wgc.read_text(encoding="utf-8-sig")
              wd_old = "public static string WorkingDirectory => AppDomain.CurrentDomain.BaseDirectory;"
              wd_new = "public static string WorkingDirectory { get; set; } = AppDomain.CurrentDomain.BaseDirectory;"
              if t.count(wd_old) != 1:
                  print(f"AVISO PATCH (--android): WorkingDirectory no encontrado ({t.count(wd_old)} coincidencias); la app Android no podra fijar su directorio de datos")
              else:
                  wgc.write_text(t.replace(wd_old, wd_new), encoding="utf-8")
                  print("android: WobbleGame.WorkingDirectory ahora es asignable")

              # 11) RIESGO EN EJECUCION: WobbleGame() llama NativeAssemblies.Copy(), que hace Directory.GetFiles("<base>/x64/");
              #     en Android ese directorio no existe (DirectoryNotFoundException al construir QuaverGame).
              na = W / "Platform" / "NativeAssemblies.cs"
              t = na.read_text(encoding="utf-8-sig")
              old = "foreach (var file in Directory.GetFiles(NativeDirectory))"
              if t.count(old) != 1:
                  print(f"AVISO PATCH (--android): NativeAssemblies.Copy distinto de lo esperado ({t.count(old)})")
              else:
                  na.write_text(t.replace(old, "if (!Directory.Exists(NativeDirectory))\n                return;\n\n            foreach (var file in Directory.GetFiles(NativeDirectory))"), encoding="utf-8")
                  print("android: NativeAssemblies.Copy no falla si no existe el directorio nativo")

              # 12) RIESGO EN EJECUCION: DllResourceStore usa Assembly.LoadFrom(<ruta del ensamblado>\\x.dll). En Android los ensamblados
              #     van dentro del APK (Location vacia): se cargan por nombre.
              dr = W / "IO" / "DllResourceStore.cs"
              t = dr.read_text(encoding="utf-8-sig")
              old = "assembly = Assembly.LoadFrom(Path.Combine(Path.GetDirectoryName(Assembly.GetCallingAssembly().Location), dllName));"
              if t.count(old) != 1:
                  print(f"AVISO PATCH (--android): DllResourceStore distinto de lo esperado ({t.count(old)})")
              else:
                  new = ("assembly = OperatingSystem.IsAndroid()\n"
                         "                ? Assembly.Load(new AssemblyName(Path.GetFileNameWithoutExtension(dllName)))\n"
                         "                : Assembly.LoadFrom(Path.Combine(Path.GetDirectoryName(Assembly.GetCallingAssembly().Location), dllName));")
                  dr.write_text(t.replace(old, new), encoding="utf-8")
                  print("android: DllResourceStore carga ensamblados por nombre")

              # 13) RIESGO EN EJECUCION: Logger escribe en <BaseDirectory>/Logs, que en Android puede no ser escribible.
              lg = W / "Logging" / "Logger.cs"
              t = lg.read_text(encoding="utf-8-sig")
              old = 'Path.Join(AppDomain.CurrentDomain.BaseDirectory, "Logs")'
              if t.count(old) != 1:
                  print(f"AVISO PATCH (--android): Logger.LogsFolder distinto de lo esperado ({t.count(old)})")
              else:
                  lg.write_text(t.replace(old, 'Path.Join(global::Wobble.WobbleGame.WorkingDirectory, "Logs")'), encoding="utf-8")
                  print("android: Logger usa WobbleGame.WorkingDirectory")
          # 14) ROBUSTEZ TEXTURAS: AssetLoader con fallback blanco 1x1 si la textura es nula
          al = W / "Assets" / "AssetLoader.cs"
          t_al = al.read_text(encoding="utf-8-sig")
          n_al, c_al = re.subn(r'(public static Texture2D LoadTexture2D\(byte\[\] data\)\s*\{\s*)(using \(var stream = new MemoryStream\(data\)\))',
                               r'\1if (data == null || data.Length == 0) { var fb = new Texture2D(GameBase.Game.GraphicsDevice, 1, 1); fb.SetData(new[] { Color.White }); return fb; }\n            \2', t_al)
          if c_al != 1: sys.exit(f"PATCH FALLIDO (AssetLoader): se esperaba 1 reemplazo y hay {c_al}")
          al.write_text(n_al, encoding="utf-8")
          print("android: AssetLoader con fallback seguro para texturas nulas")

          # 15) ROBUSTEZ AUDIO: AudioManager tolera fallo de audio sin cerrar la app en Android
          am = W / "Audio" / "AudioManager.cs"
          t_am = am.read_text(encoding="utf-8-sig")
          old_am_init = """            if (!Bass.Init(device.Value))
            {
                var error = Bass.LastError;
                Logger.Error($"BASS has failed to initialize (error code: {(int)error}, name: \"{error}\")", LogType.Runtime);

                throw new AudioEngineException("Quaver could not find an audio output device. Please connect or enable an audio output device and restart the game.");
            }"""
          new_am_init = """            if (!Bass.Init(device.Value))
            {
                var error = Bass.LastError;
                Logger.Error($"BASS has failed to initialize (error code: {(int)error}, name: \"{error}\")", LogType.Runtime);

                if (!OperatingSystem.IsAndroid())
                    throw new AudioEngineException("Quaver could not find an audio output device. Please connect or enable an audio output device and restart the game.");

                Tracks = new List<IAudioTrack>();
                return;
            }"""
          if t_am.count(old_am_init) != 1: sys.exit("PATCH FALLIDO (AudioManager.Init)")
          t_am = t_am.replace(old_am_init, new_am_init)
          old_am_lost = 'throw new AudioEngineException("Quaver lost access to its audio output device and could not find another output device. Please connect or enable an audio output device and restart the game.");'
          if t_am.count(old_am_lost) != 1: sys.exit("PATCH FALLIDO (AudioManager.LostOutput)")
          t_am = t_am.replace(old_am_lost, 'if (OperatingSystem.IsAndroid()) return;\n            ' + old_am_lost)
          am.write_text(t_am, encoding="utf-8")
          print("android: AudioManager tolera fallo de audio sin cerrar en Android")

          # 16) ROBUSTEZ IMPORTADOR: MapsetImporter omite FileSystemWatcher de escritorio en Android
          mi = root / "Quaver.Shared" / "Database" / "Maps" / "MapsetImporter.cs"
          t_mi = mi.read_text(encoding="utf-8-sig")
          n_mi, c_mi = re.subn(r'(internal static void WatchForChanges\(\)\s*\{)', r'\1\n            if (OperatingSystem.IsAndroid()) return;', t_mi)
          if c_mi != 1: sys.exit(f"PATCH FALLIDO (MapsetImporter): se esperaba 1 reemplazo y hay {c_mi}")
          mi.write_text(n_mi, encoding="utf-8")
          print("android: MapsetImporter omite FileSystemWatcher de escritorio en Android")

          # 17) ROBUSTEZ PANTALLA, PRIORIDAD Y DISCORD EN QuaverGame
          qg = root / "Quaver.Shared" / "QuaverGame.cs"
          t_qg = qg.read_text(encoding="utf-8-sig")
          old_qg_res = """        public void ChangeResolution()
        {
            if (!QuaverWindowManager.CanChangeResolutionOnScene)"""
          new_qg_res = """        public void ChangeResolution()
        {
            if (OperatingSystem.IsAndroid()) return;

            if (!QuaverWindowManager.CanChangeResolutionOnScene)"""
          if t_qg.count(old_qg_res) != 1: sys.exit("PATCH FALLIDO (QuaverGame.ChangeResolution)")
          t_qg = t_qg.replace(old_qg_res, new_qg_res)

          old_qg_prio = """        public void SetProcessPriority()
        {
            var priority = ProcessPriorityClass.Normal;"""
          new_qg_prio = """        public void SetProcessPriority()
        {
            if (OperatingSystem.IsAndroid()) return;

            var priority = ProcessPriorityClass.Normal;"""
          if t_qg.count(old_qg_prio) != 1: sys.exit("PATCH FALLIDO (QuaverGame.SetProcessPriority)")
          t_qg = t_qg.replace(old_qg_prio, new_qg_prio)

          old_qg_disc = """            // Handle discord rich presence.
            DiscordHelper.Initialize("376180410490552320");"""
          new_qg_disc = """            // Handle discord rich presence.
            if (!OperatingSystem.IsAndroid())
                DiscordHelper.Initialize("376180410490552320");"""
          if t_qg.count(old_qg_disc) != 1: sys.exit("PATCH FALLIDO (QuaverGame.DiscordHelper)")
          t_qg = t_qg.replace(old_qg_disc, new_qg_disc)
          qg.write_text(t_qg, encoding="utf-8")
          print("android: QuaverGame protegido contra ChangeResolution, Priority y Discord en Android")


          PY
      - name: Workload android y paquete MonoGame para Android
        run: |
          set +e
          dotnet workload install android 2>&1 | tail -n 5
          dotnet add Wobble/Wobble/Wobble.csproj package MonoGame.Framework.Android --version 3.8.1.303 2>&1 | tail -n 5
      - name: Crear cabecera Android (PROVISIONAL)
        run: |
          mkdir -p android-head/Resources/drawable android-head/Resources/mipmap-xxxhdpi
          cp Quaver.Resources/Quaver.Resources/Icons/quaver-logo.png android-head/Resources/drawable/icon.png
          cp Quaver.Resources/Quaver.Resources/Icons/quaver-logo.png android-head/Resources/mipmap-xxxhdpi/icon.png
          cat > android-head/QuaverAndroid.csproj <<'XMLEOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0-android</TargetFramework>
              <OutputType>Exe</OutputType>
              <RootNamespace>QuaverAndroid</RootNamespace>
              <AssemblyName>QuaverAndroid</AssemblyName>
              <SupportedOSPlatformVersion>24</SupportedOSPlatformVersion>
              <ApplicationId>org.communityport.quaverandroid</ApplicationId>
              <ApplicationVersion>1</ApplicationVersion>
              <ApplicationDisplayVersion>0.0.1-dev</ApplicationDisplayVersion>
              <RuntimeIdentifier>android-arm64</RuntimeIdentifier>
              <AndroidPackageFormat>apk</AndroidPackageFormat>
              <EmbedAssembliesIntoApk>true</EmbedAssembliesIntoApk>
              <Nullable>disable</Nullable>
              <ImplicitUsings>disable</ImplicitUsings>
              <LangVersion>latest</LangVersion>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="MonoGame.Framework.Android" Version="3.8.1.303" />
              <ProjectReference Include="../Quaver.Shared/Quaver.Shared.csproj" />
              <ProjectReference Include="../Quaver.Resources/Quaver.Resources.csproj" />
            </ItemGroup>
            <ItemGroup>
              <AndroidAsset Include="../Quaver.Shared/Content/**/*" Link="Assets/Content/%(RecursiveDir)%(Filename)%(Extension)" />
            </ItemGroup>
            <ItemGroup Condition="Exists('native/arm64-v8a/libbass.so')">
              <AndroidNativeLibrary Include="native/arm64-v8a/libbass.so" />
              <AndroidNativeLibrary Include="native/arm64-v8a/libbass_fx.so" />
